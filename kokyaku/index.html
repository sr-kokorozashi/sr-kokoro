<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>顧客マスタ｜こころざし経営労務事務所</title>
<style>
:root{
  --navy:#1F4E79; --blue:#2E75B6; --ink:#15202b; --muted:#6b7280;
  --paper:#fff; --bg:#f4f6f8; --rule:#dfe4ea; --tint:#eef3f9;
  --warn:#b45309; --warnbg:#fdf3e3; --ok:#1d6e56; --okbg:#e6f4ef;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:"Yu Gothic","游ゴシック体",YuGothic,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif;
  background:var(--bg); color:var(--ink); font-size:14px; line-height:1.7;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--blue)}

/* ---- header ---- */
header{
  background:var(--navy); color:#fff; padding:10px 16px;
  display:flex; align-items:center; gap:14px; flex-wrap:wrap;
  position:sticky; top:0; z-index:30;
}
header h1{font-size:15px;font-weight:600;margin:0;letter-spacing:.04em}
header .count{font-size:12px;opacity:.8;font-variant-numeric:tabular-nums}
header .spacer{flex:1}
header button{
  background:rgba(255,255,255,.12); color:#fff; border:1px solid rgba(255,255,255,.28);
  border-radius:4px; padding:5px 11px; font-size:12px;
}
header button:hover{background:rgba(255,255,255,.22)}
#status{font-size:11px;opacity:.75}

/* ---- filter bar ---- */
.filters{
  background:var(--paper); border-bottom:1px solid var(--rule);
  padding:9px 16px; display:flex; gap:8px; align-items:center; flex-wrap:wrap;
  position:sticky; top:44px; z-index:20;
}
.filters input[type=search]{
  flex:1; min-width:190px; padding:6px 10px;
  border:1px solid var(--rule); border-radius:4px; background:#fff;
}
.filters select{padding:6px 8px;border:1px solid var(--rule);border-radius:4px;background:#fff}
.chip{
  border:1px solid var(--rule); background:#fff; border-radius:14px;
  padding:4px 12px; font-size:12px; color:var(--muted);
}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}

/* ---- layout ---- */
.wrap{display:flex; align-items:flex-start; gap:0}
#list{
  width:290px; flex:none; border-right:1px solid var(--rule);
  background:var(--paper); height:calc(100vh - 88px); overflow-y:auto;
  position:sticky; top:88px;
}
.row{
  padding:9px 14px; border-bottom:1px solid #eef1f4; cursor:pointer;
  display:flex; align-items:baseline; gap:8px;
}
.row:hover{background:var(--tint)}
.row.sel{background:var(--tint); box-shadow:inset 3px 0 0 var(--blue)}
.row .nm{font-weight:500; flex:1; line-height:1.4}
.row .kb{font-size:10px;color:var(--muted);white-space:nowrap}
.dot{width:6px;height:6px;border-radius:50%;background:var(--warn);flex:none;margin-top:6px}
.row .tm{font-size:10px;color:#fff;background:var(--blue);border-radius:9px;padding:1px 7px;white-space:nowrap}
.row .tm.none{background:#fff;color:var(--muted);border:1px solid var(--rule)}
.ghead{
  padding:5px 14px;background:#eef3f9;border-bottom:1px solid var(--rule);
  font-size:11px;font-weight:600;color:var(--navy);letter-spacing:.04em;
  position:sticky;top:0;z-index:2;
}
.row .ck{width:14px;height:14px;border:1.5px solid #c3ccd6;border-radius:3px;flex:none;margin-top:3px}
.row .ck.on{background:var(--blue);border-color:var(--blue);position:relative}
.row .ck.on::after{content:'';position:absolute;left:4px;top:1px;width:4px;height:8px;
  border:solid #fff;border-width:0 2px 2px 0;transform:rotate(43deg)}
.bulkbar{
  background:var(--tint);border-bottom:1px solid var(--rule);padding:8px 16px;
  display:flex;gap:8px;align-items:center;flex-wrap:wrap;position:sticky;top:88px;z-index:19;
}
.bulkbar select{padding:5px 8px;border:1px solid var(--rule);border-radius:4px;background:#fff}
.bulkbar .go{background:var(--navy);color:#fff;border:none;border-radius:4px;padding:6px 13px;font-size:12px}
.bulkbar .go:disabled{background:#a9b6c4}
.bulkbar .lnk{background:none;border:none;color:var(--blue);font-size:12px;text-decoration:underline;padding:0}
.bulkbar .n{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}

/* ---- modal ---- */
.modal{position:fixed;inset:0;background:rgba(20,32,43,.38);z-index:200;
  display:none;align-items:center;justify-content:center;padding:20px}
.modal.on{display:flex}
.modal .box{background:#fff;border-radius:8px;width:100%;max-width:420px;
  max-height:82vh;overflow-y:auto;box-shadow:0 6px 30px rgba(20,40,70,.22)}
.modal h3{margin:0;padding:13px 18px;font-size:14px;color:var(--navy);
  background:var(--tint);border-bottom:1px solid var(--rule);border-radius:8px 8px 0 0}
.modal .in{padding:16px 18px}
.modal .in p.note{margin:0 0 12px;font-size:12px;color:var(--muted);line-height:1.7}
.modal label{display:block;font-size:12px;color:var(--muted);margin:11px 0 4px}
.modal label input[type=checkbox]{margin-right:7px;vertical-align:-1px}
.modal .slist .cnt{font-variant-numeric:tabular-nums;text-align:right}
.modal input[type=text],.modal select{width:100%;padding:8px 10px;
  border:1px solid var(--rule);border-radius:4px;background:#fff}
.modal .foot{padding:12px 18px;border-top:1px solid var(--rule);display:flex;gap:8px;justify-content:flex-end}
.modal .foot button{border-radius:4px;padding:7px 15px;font-size:13px;border:1px solid var(--rule);background:#fff}
.modal .foot button.pri{background:var(--navy);color:#fff;border-color:var(--navy)}
.modal .foot button.dan{background:#fff;color:#b4231f;border-color:#e6c3c1}
.slist{border:1px solid var(--rule);border-radius:5px;margin-bottom:4px}
.slist .it{display:flex;align-items:center;gap:9px;padding:8px 11px;border-bottom:1px solid #f0f2f5}
.slist .it:last-child{border-bottom:none}
.slist .it .nm{flex:1;font-weight:500}
.slist .it .cnt{font-size:11px;color:var(--muted)}
.slist .it button{border:none;background:none;color:#b4231f;font-size:12px;padding:2px 4px}
.addrow{display:flex;gap:7px;margin-top:10px}
.addrow input{flex:1}
.addrow button{border:1px solid var(--navy);background:var(--navy);color:#fff;border-radius:4px;padding:0 14px;font-size:13px}
.dz{margin-top:20px;padding-top:14px;border-top:1px solid var(--rule)}
.dz button{background:#fff;color:#b4231f;border:1px solid #e6c3c1;border-radius:4px;padding:6px 13px;font-size:12px}
.dot.hidden{visibility:hidden}

#detail{flex:1; min-width:0; padding:20px 26px 60px; height:calc(100vh - 88px); overflow-y:auto}
body.bulking #list,body.bulking #detail{height:calc(100vh - 129px)}
body.bulking #list{top:129px}
#detail h2{font-size:20px;margin:0 0 2px;color:var(--navy);font-weight:600;
  outline:none;border-radius:4px;padding:1px 5px;margin-left:-5px}
#detail h2[contenteditable]:hover{background:#fafbfc;box-shadow:inset 0 0 0 1px var(--rule)}
#detail h2[contenteditable]:focus{background:#fff;box-shadow:0 0 0 2px rgba(46,117,182,.3)}
.sub{color:var(--muted);font-size:12px;margin-bottom:18px}
.badge{
  display:inline-block;font-size:11px;padding:1px 7px;border-radius:3px;
  background:var(--tint);color:var(--navy);margin-right:5px;
}
.badge.w{background:var(--warnbg);color:var(--warn)}
.badge.o{background:var(--okbg);color:var(--ok)}

section{background:var(--paper);border:1px solid var(--rule);border-radius:6px;margin-bottom:16px}
section > h3{
  margin:0; padding:9px 15px; font-size:12px; font-weight:600; letter-spacing:.08em;
  color:var(--navy); background:var(--tint); border-bottom:1px solid var(--rule);
  border-radius:6px 6px 0 0;
}
.grid{display:grid;grid-template-columns:150px 1fr;gap:0}
.grid > div{padding:7px 15px;border-bottom:1px solid #f0f2f5}
.grid > div.k{color:var(--muted);font-size:12px;background:#fbfcfd}
.grid > div:nth-last-child(-n+2){border-bottom:none}
.v[contenteditable]{outline:none;min-height:1.7em;border-radius:3px}
.v[contenteditable]:hover{background:#fafbfc;box-shadow:inset 0 0 0 1px var(--rule)}
.v[contenteditable]:focus{background:#fff;box-shadow:inset 0 0 0 2px var(--blue)}
.v.empty:not(:focus):before{content:"未入力";color:#b9c0c8}
.v.req.empty:not(:focus):before{content:"要記入";color:var(--warn)}
.v select{border:1px solid var(--rule);border-radius:3px;padding:2px 6px;background:#fff}

/* ---- notes ---- */
.note{padding:11px 15px;border-bottom:1px solid #f0f2f5;display:flex;gap:11px;align-items:flex-start}
.note:last-of-type{border-bottom:none}
.cat{
  font-size:11px;padding:2px 8px;border-radius:3px;background:var(--tint);
  color:var(--navy);white-space:nowrap;flex:none;margin-top:2px;
}
.cat.a{background:var(--warnbg);color:var(--warn)}
.note .body{flex:1;white-space:pre-wrap;word-break:break-word;outline:none;border-radius:3px}
.note .body:focus{background:#fff;box-shadow:inset 0 0 0 2px var(--blue)}
.note .del{background:none;border:none;color:#c3cad2;font-size:15px;line-height:1;padding:2px 4px}
.note .del:hover{color:var(--warn)}
.addnote{padding:11px 15px;display:flex;gap:8px;border-top:1px solid var(--rule);background:#fbfcfd}
.addnote select{border:1px solid var(--rule);border-radius:4px;padding:5px 7px;background:#fff}
.addnote input{flex:1;border:1px solid var(--rule);border-radius:4px;padding:5px 9px}
.addnote button{border:1px solid var(--navy);background:var(--navy);color:#fff;border-radius:4px;padding:5px 14px;font-size:12px}

.empty-state{padding:70px 20px;text-align:center;color:var(--muted)}
#toast{
  position:fixed;bottom:22px;left:50%;transform:translateX(-50%);
  background:var(--navy);color:#fff;padding:9px 20px;border-radius:5px;font-size:13px;
  opacity:0;pointer-events:none;transition:opacity .22s;z-index:60;
}
#toast.show{opacity:1}

@media(max-width:820px){
  .wrap{display:block}
  #list{width:100%;height:auto;position:static;border-right:none;border-bottom:1px solid var(--rule)}
  #detail{height:auto;padding:16px}
  .grid{grid-template-columns:1fr}
  .grid > div.k{padding-bottom:0;border-bottom:none}
  body.viewing #list{display:none}
  body.viewing #back{display:inline-block}
}
#back{display:none;margin-bottom:12px;border:1px solid var(--rule);background:#fff;border-radius:4px;padding:5px 12px;font-size:12px}
</style>
</head>
<body>

<header>
  <h1>顧客マスタ</h1>
  <span class="count" id="count"></span>
  <span class="spacer"></span>
  <span id="status"></span>
  <button id="addClient">＋顧問先を追加</button>
  <button id="staffCfg">担当者設定</button>
  <button id="importBtn">データ取込</button>
  <button id="csv">CSV出力</button>
</header>

<div class="filters">
  <input type="search" id="q" placeholder="社名・担当・特記事項で検索">
  <select id="fKubun"><option value="">顧問区分：すべて</option></select>
  <select id="fHoken"><option value="">保険者：すべて</option></select>
  <select id="fJimu"><option value="">事務組合：すべて</option></select>
  <select id="fTeam"><option value="">担当：すべて</option></select>
  <select id="sortBy">
    <option value="name">並び：会社名</option>
    <option value="team">並び：担当①</option>
    <option value="kubun">並び：顧問区分</option>
  </select>
  <button class="chip" id="cWage">賃金対象のみ</button>
  <button class="chip" id="cGap">未入力あり</button>
  <button class="chip" id="cNote">特記事項あり</button>
  <button class="chip" id="cBulk">担当を一括割当</button>
</div>

<div class="bulkbar" id="bulkbar" style="display:none">
  <select id="bulk1"></select>
  <select id="bulk2"></select>
  <button class="go" id="bulkGo" disabled>選択した0社に反映</button>
  <span class="n" id="bulkN">左の一覧をクリックして選びます</span>
  <span class="spacer" style="flex:1"></span>
  <button class="lnk" id="bulkAll">表示中をすべて選択</button>
  <button class="lnk" id="bulkNone">選択を解除</button>
</div>

<div class="wrap">
  <div id="list"></div>
  <div id="detail"><div class="empty-state">左の一覧から顧問先を選んでください。</div></div>
</div>

<div class="modal" id="modal"><div class="box" id="modalBox"></div></div>

<div id="toast"></div>

<script>
/* ===========================================================
   設定：Supabaseを使う場合は下の2行を埋めてください。
   空のままだとブラウザのローカル保存（この端末のみ）で動きます。
   =========================================================== */
const SUPABASE_URL = '';
const SUPABASE_ANON_KEY = '';

/* ===========================================================
   担当者の初期値。画面の「担当者設定」から追加・削除できます。
   （ここは、いちばん最初の1回だけ使われます）
   =========================================================== */
const STAFF_DEFAULT = ['志田','武田','大江','石山','嵯峨山'];
let STAFF = STAFF_DEFAULT.slice();
/* =========================================================== */

/* ============================================================
   ログイン機能（こころざし経営労務事務所 共通）
   - Supabase Auth のメール＋パスワードでログインします
   - ログイン状態は3つのシステムで共有されます
   - 既存の fetch を包んで、anonキーの代わりに
     ログイン後のアクセストークンを送ります
   ============================================================ */
const SR_AUTH = (SUPABASE_URL && SUPABASE_ANON_KEY) ? (function () {
  const BASE = SUPABASE_URL;
  const ANON = SUPABASE_ANON_KEY;
  const STORE = 'sr_kokoro_auth';
  const raw = window.fetch.bind(window);

  let sess = null;
  try { sess = JSON.parse(localStorage.getItem(STORE) || 'null'); } catch (e) { sess = null; }

  let waiters = [];
  const save = s => { sess = s; localStorage.setItem(STORE, JSON.stringify(s)); };
  const clear = () => { sess = null; localStorage.removeItem(STORE); };

  function store(j) {
    save({
      access_token: j.access_token,
      refresh_token: j.refresh_token,
      expires_at: Date.now() + (j.expires_in || 3600) * 1000,
      email: (j.user && j.user.email) || ''
    });
  }

  async function signIn(email, password) {
    const r = await raw(BASE + '/auth/v1/token?grant_type=password', {
      method: 'POST',
      headers: { apikey: ANON, 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: email, password: password })
    });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error_description || j.msg || j.message || 'ログインできませんでした');
    store(j);
    return j;
  }

  async function refresh() {
    if (!sess || !sess.refresh_token) { clear(); return null; }
    const r = await raw(BASE + '/auth/v1/token?grant_type=refresh_token', {
      method: 'POST',
      headers: { apikey: ANON, 'Content-Type': 'application/json' },
      body: JSON.stringify({ refresh_token: sess.refresh_token })
    });
    if (!r.ok) { clear(); return null; }
    const j = await r.json();
    store(j);
    return j.access_token;
  }

  async function token() {
    if (!sess) return null;
    if (Date.now() > sess.expires_at - 60000) return await refresh();
    return sess.access_token;
  }

  function signOut() {
    const t = sess && sess.access_token;
    clear();
    if (t) raw(BASE + '/auth/v1/logout', {
      method: 'POST', headers: { apikey: ANON, Authorization: 'Bearer ' + t }
    }).catch(() => {});
    location.reload();
  }

  /* ---------- ログイン画面 ---------- */
  const css = document.createElement('style');
  css.textContent = `
  #sr-login{position:fixed;inset:0;z-index:99999;background:#f4f6f8;
    display:flex;align-items:center;justify-content:center;padding:20px;
    font-family:"Yu Gothic","游ゴシック体",YuGothic,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif}
  #sr-login .card{background:#fff;border:1px solid #dfe4ea;border-radius:8px;
    padding:30px 28px;width:100%;max-width:340px;box-shadow:0 2px 14px rgba(20,40,70,.07)}
  #sr-login h2{margin:0 0 4px;font-size:17px;color:#1F4E79;font-weight:600}
  #sr-login p.lead{margin:0 0 20px;font-size:12px;color:#6b7280}
  #sr-login label{display:block;font-size:12px;color:#6b7280;margin:12px 0 4px}
  #sr-login input{width:100%;box-sizing:border-box;padding:9px 11px;font-size:14px;
    border:1px solid #dfe4ea;border-radius:5px;background:#fff;
    font-family:inherit;color:#15202b}
  #sr-login input:focus{outline:none;border-color:#2E75B6;box-shadow:0 0 0 3px rgba(46,117,182,.13)}
  #sr-login button{width:100%;margin-top:20px;padding:10px;font-size:14px;
    background:#1F4E79;color:#fff;border:none;border-radius:5px;cursor:pointer;
    font-family:inherit;font-weight:500}
  #sr-login button:hover{background:#18395a}
  #sr-login button:disabled{background:#9fb2c6;cursor:default}
  #sr-login .err{margin-top:14px;font-size:12px;color:#b45309;
    background:#fdf3e3;border-radius:4px;padding:8px 10px;display:none;line-height:1.6}
  #sr-logout{position:fixed;left:10px;bottom:10px;z-index:9998;
    font-size:11px;color:#6b7280;background:rgba(255,255,255,.92);
    border:1px solid #dfe4ea;border-radius:13px;padding:4px 11px;cursor:pointer;
    font-family:"Yu Gothic",YuGothic,Meiryo,sans-serif;line-height:1.6}
  #sr-logout:hover{color:#1F4E79;border-color:#2E75B6}
  @media print{#sr-logout{display:none}}`;
  document.head.appendChild(css);

  function showLogin() {
    if (document.getElementById('sr-login')) return;
    const el = document.createElement('div');
    el.id = 'sr-login';
    el.innerHTML =
      '<div class="card">' +
      '<h2>こころざし経営労務事務所</h2>' +
      '<p class="lead">事務所のアカウントでログインしてください。</p>' +
      '<label for="sr-id">ログインID</label>' +
      '<input id="sr-id" type="text" autocomplete="username" autocapitalize="off" spellcheck="false">' +
      '<label for="sr-pw">パスワード</label>' +
      '<input id="sr-pw" type="password" autocomplete="current-password">' +
      '<button id="sr-go">ログイン</button>' +
      '<div class="err" id="sr-err"></div>' +
      '</div>';
    document.body.appendChild(el);
    const idEl = el.querySelector('#sr-id'), pwEl = el.querySelector('#sr-pw');
    const btn = el.querySelector('#sr-go'), err = el.querySelector('#sr-err');
    idEl.focus();

    async function go() {
      const id = idEl.value.trim(), pw = pwEl.value;
      if (!id || !pw) { err.textContent = 'ログインIDとパスワードを入力してください。'; err.style.display = 'block'; return; }
      btn.disabled = true; btn.textContent = '確認中…'; err.style.display = 'none';
      try {
        await signIn(id, pw);
        el.remove();
        mountLogout();
        const ws = waiters; waiters = [];
        ws.forEach(fn => fn(sess.access_token));
      } catch (e) {
        err.textContent = String(e.message || e).indexOf('Invalid') >= 0
          ? 'ログインIDまたはパスワードが違います。'
          : ('ログインできませんでした：' + (e.message || e));
        err.style.display = 'block';
        btn.disabled = false; btn.textContent = 'ログイン';
        pwEl.value = ''; pwEl.focus();
      }
    }
    btn.onclick = go;
    [idEl, pwEl].forEach(x => x.addEventListener('keydown', e => { if (e.key === 'Enter') go(); }));
  }

  function mountLogout() {
    if (document.getElementById('sr-logout') || !sess) return;
    const b = document.createElement('button');
    b.id = 'sr-logout';
    b.textContent = (sess.email ? sess.email.split('@')[0] + ' ・ ' : '') + 'ログアウト';
    b.onclick = () => { if (confirm('ログアウトしますか？')) signOut(); };
    document.body.appendChild(b);
  }

  /* 有効なトークンを返す。未ログインならログイン画面を出して待つ */
  async function ready() {
    const t = await token();
    if (t) return t;
    showLogin();
    return new Promise(res => waiters.push(res));
  }

  /* ---------- fetch を包む ---------- */
  window.fetch = async function (input, init) {
    const url = typeof input === 'string' ? input : (input && input.url) || '';
    if (!url.startsWith(BASE) || url.indexOf('/auth/v1/') >= 0) return raw(input, init);

    init = Object.assign({}, init);
    const t = await ready();
    const h = new Headers((init && init.headers) || (typeof input !== 'string' && input.headers) || {});
    h.set('apikey', ANON);
    h.set('Authorization', 'Bearer ' + t);
    init.headers = h;

    let res = await raw(url, init);
    if (res.status === 401) {
      const t2 = await refresh();
      if (t2) { h.set('Authorization', 'Bearer ' + t2); res = await raw(url, init); }
      else { showLogin(); }
    }
    return res;
  };

const SETTINGS_ID = '__settings__';
async function saveSettings(){
  if(remote){

        headers:{Prefer:'resolution=merge-duplicates,return=minimal'},
        body: JSON.stringify({id:SETTINGS_ID, data:{staff:STAFF}})});
    }catch(e){ console.error(e); toast('担当者の保存に失敗しました'); return false; }
  } else local.flush();
  return true;

async function rest(path, opts){
  opts = Object.assign({}, opts);
  opts.headers = Object.assign({'Content-Type':'application/json'}, opts.headers||{});
  const r = await fetch(SUPABASE_URL + '/rest/v1/' + path, opts);
  if(!r.ok) throw new Error(await r.text());
  if(r.status === 204) return null;
  const t = await r.text();
  return t ? JSON.parse(t) : null;
}

async function boot(){
  if(SUPABASE_URL && SUPABASE_ANON_KEY){
    try{
      let cs = await rest('clients?select=id,data');
      const st0 = (cs||[]).find(r=>r.id===SETTINGS_ID);
      if(st0 && st0.data && Array.isArray(st0.data.staff)) STAFF = st0.data.staff;
      if(!cs || !cs.filter(r=>r.id!==SETTINGS_ID).length){
        await rest('clients', {method:'POST', headers:{Prefer:'return=minimal'},
          body: JSON.stringify(SEED.clients.map(c=>({id:c.id, data:c})))});
        await rest('client_notes', {method:'POST', headers:{Prefer:'return=minimal'},
          body: JSON.stringify(SEED.notes.map(n=>({client_id:n.client, data:{cat:n.cat, body:n.body}})))});
        toast('初期データを投入しました');
        cs = await rest('clients?select=id,data');
      }
      clients = cs.filter(r=>r.id!==SETTINGS_ID).map(r=>Object.assign({}, r.data, {id:r.id}));
      const ns = await rest('client_notes?select=id,client_id,data') || [];
      notes = ns.map(r=>({id:r.id, client:r.client_id, cat:r.data.cat, body:r.data.body}));
      remote = true;
      st('Supabase接続中');
    }catch(err){
      console.error(err); st('Supabase接続失敗 — ローカル保存で動作中'); local.load();
    }
  } else { st('ローカル保存（この端末のみ）'); local.load(); }
  initFilters(); render();
}

function diffSeed(){

    if(!c){ add.push(s); return; }
    Object.keys(s).forEach(k=>{
      if(skip.has(k) || typeof s[k]!=='string' || !s[k]) return;
      const cur = c[k]||'';
      if(!cur) fill.push({c,k,v:s[k]});
      else if(cur!==s[k]) over.push({c,k,v:s[k],cur});
    });
  });
  const newNotes = SEED.notes.filter(n=>{
    const c = clients.find(x=>x.id===n.client);
    if(!c) return false;
    return !notes.some(o=>o.client===n.client && o.cat===n.cat && o.body===n.body);
  });
  return {fill,over,add,newNotes};
}

function importDialog(){
  const D = diffSeed();
  const list = D.over.slice(0,12).map(o=>
    `<div class="it"><span class="nm">${esc(o.c.name)}</span><span class="cnt">${esc(o.k)}：${esc(o.cur)} → ${esc(o.v)}</span></div>`).join('');
  const box = modal.open(`
    <h3>データ取込</h3>
    <div class="in">
      <p class="note">このファイルに入っているデータを、いま使っているデータへ反映します。<br>
      空欄を埋めるだけなら、入力済みの内容が消えることはありません。</p>
      <div class="slist">
        <div class="it"><span class="nm">空欄を埋める</span><span class="cnt">${D.fill.length}項目</span></div>
        <div class="it"><span class="nm">値が食い違う</span><span class="cnt">${D.over.length}項目</span></div>
        <div class="it"><span class="nm">こちらにない会社</span><span class="cnt">${D.add.length}社</span></div>
        <div class="it"><span class="nm">追加される特記事項</span><span class="cnt">${D.newNotes.length}件</span></div>
      </div>
      ${D.over.length?`<label>食い違いの例</label><div class="slist">${list}
        ${D.over.length>12?`<div class="it"><span class="cnt">ほか${D.over.length-12}項目</span></div>`:''}</div>`:''}
      <label><input type="checkbox" id="imOver" style="width:auto"> 食い違う値も上書きする</label>
      <label><input type="checkbox" id="imAdd" style="width:auto"> こちらにない会社を追加する</label>
    </div>
    <div class="foot">
      <button id="imCancel">キャンセル</button>
      <button class="pri" id="imGo">取り込む</button>
    </div>`);
  box.querySelector('#imCancel').onclick = modal.close;
  box.querySelector('#imGo').onclick = async ()=>{
    const doOver = box.querySelector('#imOver').checked;
    const doAdd  = box.querySelector('#imAdd').checked;
    const touched = new Set();
    D.fill.forEach(f=>{ f.c[f.k]=f.v; touched.add(f.c); });
    if(doOver) D.over.forEach(o=>{ o.c[o.k]=o.v; touched.add(o.c); });
    box.querySelector('#imGo').disabled = true;
    box.querySelector('#imGo').textContent = '取り込み中…';
    for(const c of touched) await saveClient(c, true);
    if(doAdd) for(const s of D.add) await createClient(structuredClone(s));
    for(const n of D.newNotes) await addNote(n.client, n.cat, n.body);
    modal.close();
    refreshStaffSelects(); render();
    toast(touched.size + '社を更新しました');
  };
}

/* 顧問先の追加 */
function addClientDialog(){
  const sOpts = v => ['',...STAFF].map(n=>`<option value="${esc(n)}"${n===v?' selected':''}>${esc(n||'—')}</option>`).join('');
  const box = modal.open(`
    <h3>顧問先を追加</h3>
    <div class="in">
      <p class="note">会社名だけ入れれば登録できます。残りの項目はあとから詳細画面で埋められます。</p>
      <label>会社名（必須）</label>
      <input type="text" id="acName" placeholder="株式会社◯◯">
      <label>顧問区分</label>
      <select id="acKubun">${OPTS.kubun.map(o=>`<option value="${esc(o)}">${esc(o||'—')}</option>`).join('')}</select>
      <label>担当①</label><select id="acS1">${sOpts('')}</select>
      <label>担当②</label><select id="acS2">${sOpts('')}</select>
    </div>
    <div class="foot">
      <button id="acCancel">キャンセル</button>
      <button class="pri" id="acGo">追加する</button>
    </div>`);
  const go=async ()=>{
    const name = box.querySelector('#acName').value.trim();
    if(!name){ toast('会社名を入れてください'); box.querySelector('#acName').focus(); return; }
    if(clients.some(c=>c.name===name) && !confirm('同じ名前の顧問先がすでにあります。追加しますか？')) return;
    let id = name, i = 2;
    while(clients.some(c=>c.id===id)) id = name + '_' + (i++);
    const c = {};
    ['id','name','wage_no','kubun','shutan','fukutan','madoguchi','renraku','sho','koyo',
     'hokensha','kenpo_name','jimu','shime','harai','shime_raw','nyuryoku','roudou','shikyu','kojo',
     'sokyu','keiro','dare','keishiki','hozon','k_to','k_how','d_to','d_how','bikou'].forEach(k=>c[k]='');
    c.id=id; c.name=name; c.kenpo_denshi=false; c.sources=[];
    c.kubun = box.querySelector('#acKubun').value;
    c.shutan = box.querySelector('#acS1').value;
    c.fukutan = box.querySelector('#acS2').value;
    if(!await createClient(c)) return;
    modal.close();
    sel = c; document.body.classList.add('viewing');
    refreshStaffSelects(); render();
    toast(name + ' を追加しました');
  };
  box.querySelector('#acGo').onclick=go;
  box.querySelector('#acCancel').onclick=modal.close;
  box.querySelector('#acName').addEventListener('keydown',e=>{ if(e.key==='Enter') go(); });
  box.querySelector('#acName').focus();
}

const KUBUN_ORDER = ['手続き・給与計算','給与計算','手続き','相談顧問'];
function sortRows(rows){
  const byName=(a,b)=>a.name.localeCompare(b.name,'ja');
  if(state.sort==='team'){
    const rank=c=>{const i=STAFF.indexOf(c.shutan||''); return i<0?(c.shutan?900:999):i;};
    return rows.slice().sort((a,b)=>rank(a)-rank(b) || (a.shutan||'').localeCompare(b.shutan||'','ja') || byName(a,b));
  }
  if(state.sort==='kubun'){
    const rank=c=>{const i=KUBUN_ORDER.indexOf(c.kubun||''); return i<0?99:i;};
    return rows.slice().sort((a,b)=>rank(a)-rank(b) || byName(a,b));
  }
  return rows.slice().sort(byName);
}

function filtered(){
  const q = state.q.trim().toLowerCase();
  return clients.filter(c=>{
    if(state.kubun && c.kubun!==state.kubun) return false;
    if(state.hoken && c.hokensha!==state.hoken) return false;
    if(state.jimu && c.jimu!==state.jimu) return false;
    if(state.staff==='__none__' && staffOf(c).length) return false;
    if(state.staff && state.staff!=='__none__' && !hasStaff(c,state.staff)) return false;
    if(state.wage && !c.wage_no) return false;
    if(state.gap && !gapsOf(c).length) return false;
    if(state.note && !notesOf(c.id).length) return false;
    if(q){
      const hay = [c.name,c.wage_no,c.shutan,c.fukutan,c.madoguchi,c.dare,c.k_to,c.d_to,c.sokyu,c.bikou]
        .concat(notesOf(c.id).map(n=>n.body)).join(' ').toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
}

/* ---------- render ---------- */
function render(){
  const rows = sortRows(filtered());
  document.getElementById('count').textContent = rows.length + ' / ' + clients.length + ' 社';

  let html = '', last = null;
  rows.forEach(c=>{
    if(state.sort==='team' && !state.staff){
      const g = c.shutan || '担当 未設定';
      if(g!==last){ html += `<div class="ghead">${esc(g)}（${rows.filter(x=>(x.shutan||'担当 未設定')===g).length}社）</div>`; last=g; }
    } else if(state.sort==='kubun'){
      const g = c.kubun || '区分なし';
      if(g!==last){ html += `<div class="ghead">${esc(g)}（${rows.filter(x=>(x.kubun||'区分なし')===g).length}社）</div>`; last=g; }
    }
    const tm = staffOf(c).join('・');
    html += `
    <div class="row ${!bulk&&sel&&sel.id===c.id?'sel':''}" data-id="${esc(c.id)}">
      ${bulk ? `<span class="ck ${picked.has(c.id)?'on':''}"></span>`
             : `<span class="dot ${gapsOf(c).length?'':'hidden'}"></span>`}
      <span class="nm">${esc(c.name)}</span>
      <span class="tm ${tm?'':'none'}">${esc(tm||'未設定')}</span>
      <span class="kb">${esc(c.kubun||'—')}</span>
    </div>`;
  });
  document.getElementById('list').innerHTML = html || '<div class="empty-state">該当する顧問先がありません。</div>';

  document.querySelectorAll('.row').forEach(r=>{
    r.onclick=()=>{
      if(bulk){
        const id=r.dataset.id;
        picked.has(id) ? picked.delete(id) : picked.add(id);
        render(); return;
      }
      sel = clients.find(c=>c.id===r.dataset.id); document.body.classList.add('viewing'); render();
    };
  });
  if(bulk) syncBulk();
  renderDetail();
}

function syncBulk(){
  const n = picked.size;
  const go = document.getElementById('bulkGo');
  go.textContent = '選択した' + n + '社に反映';
  go.disabled = !n;
  document.getElementById('bulkN').textContent = n ? '' : '左の一覧をクリックして選びます';
}

async function applyBulk(){
  const v1 = document.getElementById('bulk1').value;
  const v2 = document.getElementById('bulk2').value;
  if(v1==='__keep__' && v2==='__keep__'){ toast('割り当てる担当を選んでください'); return; }
  const ids = [...picked];
  let ok = 0;
  for(const id of ids){
    const c = clients.find(x=>x.id===id);
    if(!c) continue;
    if(v1!=='__keep__') c.shutan = v1;
    if(v2!=='__keep__') c.fukutan = v2;
    if(await saveClient(c, true)) ok++;
  }
  picked.clear();
  toast(ok + '社の担当を更新しました');
  render();
}

function field(c,key,label,opts,req){
  const val = c[key]||'';
  if(opts){
    return `<div class="k">${label}</div><div class="v"><select data-k="${key}">`+
      opts.map(o=>`<option value="${esc(o)}"${o===val?' selected':''}>${esc(o||'—')}</option>`).join('')+
      `</select></div>`;
  }
  return `<div class="k">${label}</div>`+
    `<div class="v${val?'':' empty'}${req?' req':''}" contenteditable data-k="${key}">${esc(val)}</div>`;
}

function renderDetail(){
  const d = document.getElementById('detail');
  if(!sel){ d.innerHTML='<div class="empty-state">左の一覧から顧問先を選んでください。</div>'; return; }
  const c = sel, gaps = gapsOf(c), ns = notesOf(c.id);
  const srcMissing = ['カルテ','賃金','ルーティング'].filter(s=>!(c.sources||[]).includes(s));

  d.innerHTML = `
  <button id="back">← 一覧へ</button>
  <h2 contenteditable data-k="name" spellcheck="false">${esc(c.name)}</h2>
  <div class="sub">
    ${(c.sources||[]).map(s=>`<span class="badge o">${esc(s)}に登録</span>`).join('')}
    ${srcMissing.map(s=>`<span class="badge w">${esc(s)}に未登録</span>`).join('')}
    ${gaps.length?`<span class="badge w">要記入 ${gaps.length}項目</span>`:''}
  </div>

  <section><h3>基本情報</h3><div class="grid">
    ${field(c,'wage_no','事業所No（ろうむinOne）')}
    ${field(c,'kubun','顧問区分',OPTS.kubun)}
    ${field(c,'shutan','担当①',staffOpts(c.shutan),true)}
    ${field(c,'fukutan','担当②',staffOpts(c.fukutan))}
    ${field(c,'madoguchi','連絡窓口')}
    ${field(c,'renraku','連絡方法')}
    ${field(c,'sho','社保手続き',[...new Set([...OPTS.tetsuzuki, c.sho||''])])}
    ${field(c,'koyo','雇保手続き',[...new Set([...OPTS.tetsuzuki, c.koyo||''])])}
  </div></section>

  <section><h3>社会保険</h3><div class="grid">
    ${field(c,'hokensha','保険者',OPTS.hokensha)}
    ${field(c,'kenpo_name','健保組合名',null,c.hokensha==='健保組合')}
    ${field(c,'jimu','事務組合',OPTS.jimu)}
    ${field(c,'kojo','社保料控除月',OPTS.kojo)}
  </div></section>

  <section><h3>賃金入力</h3><div class="grid">
    ${field(c,'shime','締日',null,true)}
    ${field(c,'harai','支払日')}
    ${field(c,'shime_raw','〆・支払（原文）')}
    ${field(c,'nyuryoku','入力する月',OPTS.nyuryoku)}
    ${field(c,'roudou','労働月表示')}
    ${field(c,'shikyu','支給月表示')}
    ${field(c,'sokyu','総支給額の定義')}
  </div></section>

  <section><h3>回収と送付</h3><div class="grid">
    ${field(c,'keiro','回収経路',OPTS.keiro,true)}
    ${field(c,'dare','回収先（誰から）')}
    ${field(c,'keishiki','データ形式')}
    ${field(c,'hozon','保存先',OPTS.hozon)}
    ${field(c,'k_to','社保控除表の送付先')}
    ${field(c,'k_how','社保控除表の送付方法',OPTS.k_how)}
    ${field(c,'d_to','公文書の送付先')}
    ${field(c,'d_how','公文書の送付方法',OPTS.d_how)}
    ${field(c,'bikou','備考')}
  </div></section>

  <section><h3>特記事項・イレギュラー（${ns.length}件）</h3>
    ${ns.map((n,i)=>`
      <div class="note" data-i="${i}">
        <span class="cat ${ALERT_CATS.includes(n.cat)?'a':''}">${esc(n.cat)}</span>
        <div class="body" contenteditable>${esc(n.body)}</div>
        <button class="del" title="削除">×</button>
      </div>`).join('') || '<div style="padding:14px 15px;color:#8a93a0">まだ登録がありません。</div>'}
    <div class="addnote">
      <select id="nc">${CATS.map(x=>`<option>${x}</option>`).join('')}</select>
      <input id="nb" placeholder="例：入社時にどちらの保育園か確認する">
      <button id="na">追加</button>
    </div>
  </section>

  <div class="dz"><button id="delClient">この顧問先を削除</button></div>`;

  d.querySelector('#delClient').onclick = async ()=>{
    if(!confirm(c.name + ' を削除します。\n特記事項もまとめて消え、元に戻せません。よろしいですか？')) return;
    if(!await deleteClient(c)) return;
    sel = null; document.body.classList.remove('viewing');
    refreshStaffSelects(); render(); toast(c.name + ' を削除しました');
  };

  d.querySelector('#back').onclick=()=>{document.body.classList.remove('viewing');sel=null;render();};

  d.querySelectorAll('[contenteditable][data-k]').forEach(el=>{
    el.addEventListener('blur',()=>{
      const v = el.textContent.trim();
      if(v === (c[el.dataset.k]||'')) return;
      if(el.dataset.k==='name' && !v){ el.textContent = c.name; toast('会社名は空にできません'); return; }
      c[el.dataset.k]=v; saveClient(c); render();
    });
  });
  d.querySelectorAll('select[data-k]').forEach(el=>{
    el.onchange=()=>{
      c[el.dataset.k]=el.value;
      saveClient(c); render(); renderDetail();
    };
  });
  d.querySelectorAll('.note').forEach(el=>{
    const n = ns[+el.dataset.i];
    el.querySelector('.body').addEventListener('blur',e=>{
      const v=e.target.textContent.trim();
      if(v===n.body) return;
      if(!v){ removeNote(n).then(render); return; }
      n.body=v; updateNote(n);
    });
    el.querySelector('.del').onclick=()=>{ if(confirm('この特記事項を削除しますか？')) removeNote(n).then(render); };
  });
  d.querySelector('#na').onclick=()=>{
    const b=d.querySelector('#nb').value.trim();
    if(!b) return;
    addNote(c.id, d.querySelector('#nc').value, b).then(render);
  };
  d.querySelector('#nb').addEventListener('keydown',e=>{ if(e.key==='Enter') d.querySelector('#na').click(); });
}

/* ---------- events ---------- */
document.getElementById('q').oninput = e=>{state.q=e.target.value;render();};
document.getElementById('fKubun').onchange = e=>{state.kubun=e.target.value;render();};
document.getElementById('fHoken').onchange = e=>{state.hoken=e.target.value;render();};
document.getElementById('fJimu').onchange = e=>{state.jimu=e.target.value;render();};
document.getElementById('staffCfg').onclick = staffDialog;
document.getElementById('importBtn').onclick = importDialog;
document.getElementById('addClient').onclick = addClientDialog;
document.getElementById('fTeam').onchange = e=>{state.staff=e.target.value;render();};
document.getElementById('sortBy').onchange = e=>{state.sort=e.target.value;render();};
document.getElementById('cBulk').onclick = e=>{
  bulk=!bulk; picked.clear();
  e.target.classList.toggle('on',bulk);
  document.getElementById('bulkbar').style.display = bulk?'flex':'none';
  document.body.classList.toggle('bulking',bulk);
  if(bulk){ sel=null; document.body.classList.remove('viewing'); }
  render();
};
document.getElementById('bulkGo').onclick = ()=>applyBulk();
document.getElementById('bulkAll').onclick = ()=>{ sortRows(filtered()).forEach(c=>picked.add(c.id)); render(); };
document.getElementById('bulkNone').onclick = ()=>{ picked.clear(); render(); };
[['cWage','wage'],['cGap','gap'],['cNote','note']].forEach(([id,k])=>{
  document.getElementById(id).onclick = e=>{ state[k]=!state[k]; e.target.classList.toggle('on',state[k]); render(); };
});

document.getElementById('csv').onclick = ()=>{
  const cols = [['name','会社名'],['wage_no','事業所No'],['kubun','顧問区分'],['shutan','担当①'],['fukutan','担当②'],['madoguchi','連絡窓口'],
    ['renraku','連絡方法'],['sho','社保手続き'],['koyo','雇保手続き'],['hokensha','保険者'],
    ['kenpo_name','健保組合名'],['jimu','事務組合'],['kojo','社保料控除月'],['shime','締日'],['harai','支払日'],
    ['shime_raw','〆・支払（原文）'],['nyuryoku','入力する月'],['roudou','労働月表示'],['shikyu','支給月表示'],
    ['sokyu','総支給額の定義'],['keiro','回収経路'],['dare','回収先'],['keishiki','データ形式'],['hozon','保存先'],
    ['k_to','社保控除表の送付先'],['k_how','社保控除表の送付方法'],['d_to','公文書の送付先'],
    ['d_how','公文書の送付方法'],['bikou','備考']];
  const q = s => '"'+String(s==null?'':s).replace(/"/g,'""')+'"';
  const lines = [cols.map(c=>q(c[1])).concat(q('特記事項')).join(',')];
  sortRows(filtered()).forEach(c=>{
    const ns = notesOf(c.id).map(n=>'['+n.cat+'] '+n.body).join(' / ');
    lines.push(cols.map(col=>q(c[col[0]])).concat(q(ns)).join(','));
  });
  const blob = new Blob(['\uFEFF'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '顧客マスタ_'+new Date().toISOString().slice(0,10)+'.csv';
  a.click();
};

boot();
