<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>顧客マスタ｜こころざし経営労務事務所</title>
<style>
:root{
  --navy:#1F4E79; --blue:#2E75B6; --ink:#15202b; --muted:#6b7280;
  --paper:#fff; --bg:#f4f6f8; --rule:#dfe4ea; --tint:#eef3f9;
  --hh:44px; --stick:88px;   /* 見出し帯の高さ。帯が2段に折り返しても一覧が隠れないよう、画面側で測って入れ直します */
  --warn:#b45309; --warnbg:#fdf3e3; --ok:#1d6e56; --okbg:#e6f4ef;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:"Yu Gothic","游ゴシック体",YuGothic,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif;
  background:var(--bg); color:var(--ink); font-size:14px; line-height:1.7;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--blue)}

/* ---- header ---- */
header{
  background:var(--navy); color:#fff; padding:10px 16px;
  display:flex; align-items:center; gap:14px; flex-wrap:wrap;
  position:sticky; top:0; z-index:30;
}
header h1{font-size:15px;font-weight:600;margin:0;letter-spacing:.04em}
header .count{font-size:12px;opacity:.8;font-variant-numeric:tabular-nums}
header .spacer{flex:1}
header button{
  background:rgba(255,255,255,.12); color:#fff; border:1px solid rgba(255,255,255,.28);
  border-radius:4px; padding:5px 11px; font-size:12px;
}
header button:hover{background:rgba(255,255,255,.22)}
#status{font-size:11px;opacity:.75}

/* ---- filter bar ---- */
.filters{
  background:var(--paper); border-bottom:1px solid var(--rule);
  padding:9px 16px; display:flex; gap:8px; align-items:center; flex-wrap:wrap;
  position:sticky; top:var(--hh); z-index:20;
}
.filters input[type=search]{
  flex:1; min-width:190px; padding:6px 10px;
  border:1px solid var(--rule); border-radius:4px; background:#fff;
}
.filters select{padding:6px 8px;border:1px solid var(--rule);border-radius:4px;background:#fff}
.chip{
  border:1px solid var(--rule); background:#fff; border-radius:14px;
  padding:4px 12px; font-size:12px; color:var(--muted);
}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}

/* ---- layout ---- */
.wrap{display:flex; align-items:flex-start; gap:0}
#list{
  width:290px; flex:none; border-right:1px solid var(--rule);
  background:var(--paper); height:calc(100vh - var(--stick)); overflow-y:auto;
  position:sticky; top:var(--stick);
}
.row{
  padding:8px 14px; border-bottom:1px solid #eef1f4; cursor:pointer;
  display:flex; align-items:flex-start; gap:8px;
}
.row:hover{background:var(--tint)}
.row.sel{background:var(--tint); box-shadow:inset 3px 0 0 var(--blue)}
/* 社名は1行目、担当や区分は2行目。列が狭くても社名が縦に割れないようにしています */
.rmain{flex:1; min-width:0}
.rtop{display:flex; align-items:baseline; gap:7px}
.rsub{display:flex; align-items:center; gap:5px; flex-wrap:wrap; margin-top:3px}
.row .nm{font-weight:500; line-height:1.4; word-break:break-word; flex:1; min-width:0}
.row .kb{font-size:10px;color:var(--muted);white-space:nowrap}
.row .wno{
  font-size:11px;color:var(--navy);background:var(--tint);border-radius:3px;
  padding:1px 6px;min-width:34px;text-align:right;flex:none;font-variant-numeric:tabular-nums;
}
.row .wno.none{color:#b6bec7;background:transparent}
.dot{width:6px;height:6px;border-radius:50%;background:var(--warn);flex:none;margin-top:7px}
.row .tm{font-size:10px;color:#fff;background:var(--blue);border-radius:9px;padding:1px 7px;white-space:nowrap}
.row .fg{font-size:10px;border-radius:3px;padding:1px 5px;white-space:nowrap;font-weight:600}
.row .fg.w{background:#fff4e2;color:#9a5b00;border:1px solid #e8c894}
.row .fg.o{background:#f0f2f5;color:#5b6672;border:1px solid #d3dae2}
.row .fg.k{background:#eaf1fb;color:#1f4e79;border:1px solid #bcd2ec}
.row .tm.none{background:#fff;color:var(--muted);border:1px solid var(--rule)}
.ghead{
  padding:5px 14px;background:#eef3f9;border-bottom:1px solid var(--rule);
  font-size:11px;font-weight:600;color:var(--navy);letter-spacing:.04em;
  position:sticky;top:0;z-index:2;
}
.row .ck{width:14px;height:14px;border:1.5px solid #c3ccd6;border-radius:3px;flex:none;margin-top:3px}
.row .ck.on{background:var(--blue);border-color:var(--blue);position:relative}
.row .ck.on::after{content:'';position:absolute;left:4px;top:1px;width:4px;height:8px;
  border:solid #fff;border-width:0 2px 2px 0;transform:rotate(43deg)}
.bulkbar{
  background:var(--tint);border-bottom:1px solid var(--rule);padding:8px 16px;
  display:flex;gap:8px;align-items:center;flex-wrap:wrap;position:sticky;top:var(--stick);z-index:19;
}
.bulkbar select{padding:5px 8px;border:1px solid var(--rule);border-radius:4px;background:#fff}
.bulkbar .go{background:var(--navy);color:#fff;border:none;border-radius:4px;padding:6px 13px;font-size:12px}
.bulkbar .go:disabled{background:#a9b6c4}
.bulkbar .lnk{background:none;border:none;color:var(--blue);font-size:12px;text-decoration:underline;padding:0}
.bulkbar .n{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}

/* ---- modal ---- */
.modal{position:fixed;inset:0;background:rgba(20,32,43,.38);z-index:200;
  display:none;align-items:center;justify-content:center;padding:20px}
.modal.on{display:flex}
.modal .box{background:#fff;border-radius:8px;width:100%;max-width:420px;
  max-height:82vh;overflow-y:auto;box-shadow:0 6px 30px rgba(20,40,70,.22)}
.modal h3{margin:0;padding:13px 18px;font-size:14px;color:var(--navy);
  background:var(--tint);border-bottom:1px solid var(--rule);border-radius:8px 8px 0 0}
.modal .in{padding:16px 18px}
.modal .in p.note{margin:0 0 12px;font-size:12px;color:var(--muted);line-height:1.7}
.modal label{display:block;font-size:12px;color:var(--muted);margin:11px 0 4px}
.modal label input[type=checkbox]{margin-right:7px;vertical-align:-1px}
.modal .slist .cnt{font-variant-numeric:tabular-nums;text-align:right}
.modal input[type=text],.modal select{width:100%;padding:8px 10px;
  border:1px solid var(--rule);border-radius:4px;background:#fff}
.modal .foot{padding:12px 18px;border-top:1px solid var(--rule);display:flex;gap:8px;justify-content:flex-end}
.modal .foot button{border-radius:4px;padding:7px 15px;font-size:13px;border:1px solid var(--rule);background:#fff}
.modal .foot button.pri{background:var(--navy);color:#fff;border-color:var(--navy)}
.modal .foot button.dan{background:#fff;color:#b4231f;border-color:#e6c3c1}
.slist{border:1px solid var(--rule);border-radius:5px;margin-bottom:4px}
.slist .it{display:flex;align-items:center;gap:9px;padding:8px 11px;border-bottom:1px solid #f0f2f5}
.slist .it:last-child{border-bottom:none}
.slist .it .nm{flex:1;font-weight:500}
.slist .it .cnt{font-size:11px;color:var(--muted)}
.slist .it button{border:none;background:none;color:#b4231f;font-size:12px;padding:2px 4px}
.addrow{display:flex;gap:7px;margin-top:10px}
.addrow input{flex:1}
.addrow button{border:1px solid var(--navy);background:var(--navy);color:#fff;border-radius:4px;padding:0 14px;font-size:13px}
.dz{margin-top:20px;padding-top:14px;border-top:1px solid var(--rule)}
.dz button{background:#fff;color:#b4231f;border:1px solid #e6c3c1;border-radius:4px;padding:6px 13px;font-size:12px}
.dot.hidden{visibility:hidden}

#detail{flex:1; min-width:0; padding:20px 26px 60px; height:calc(100vh - var(--stick)); overflow-y:auto}
body.bulking #list,body.bulking #detail{height:calc(100vh - var(--stick) - var(--bb,41px))}
body.bulking #list{top:calc(var(--stick) + var(--bb,41px))}
#detail h2{font-size:20px;margin:0 0 2px;color:var(--navy);font-weight:600;
  outline:none;border-radius:4px;padding:1px 5px;margin-left:-5px}
#detail h2[contenteditable]:hover{background:#fafbfc;box-shadow:inset 0 0 0 1px var(--rule)}
#detail h2[contenteditable]:focus{background:#fff;box-shadow:0 0 0 2px rgba(46,117,182,.3)}
.sub{color:var(--muted);font-size:12px;margin-bottom:18px}
.badge{
  display:inline-block;font-size:11px;padding:1px 7px;border-radius:3px;
  background:var(--tint);color:var(--navy);margin-right:5px;
}
.badge.w{background:var(--warnbg);color:var(--warn)}
.badge.o{background:var(--okbg);color:var(--ok)}

section{background:var(--paper);border:1px solid var(--rule);border-radius:6px;margin-bottom:16px}
/* 特記事項は緑地に白いカードを並べる形にして、他のセクションと区別しています（★とは別） */
section.notes{border-color:#b6cec2;background:#e3eee8;box-shadow:0 1px 5px rgba(21,50,40,.10)}
section.notes > h3{background:var(--ok);color:#fff;border-bottom-color:var(--ok);letter-spacing:.1em}
section.notes .notefilter{background:#d3e4db;border-bottom:1px solid #bfd6ca}
.nbody{padding:10px 10px 12px}
section.notes .note{
  background:#fff;border:1px solid #d3e2da;border-radius:6px;
  padding:10px 12px;margin-bottom:8px;
}
section.notes .note:last-of-type{margin-bottom:0}
section.notes .note.starred{background:#fff8ee;border-color:#e3bf88;box-shadow:inset 4px 0 0 #dc9b34}

/* 追加欄は特記事項の枠の外に、独立したカードとして置きます */
.addout{margin-bottom:16px}
.addout .addnote{
  background:var(--paper);border:1px solid var(--rule);border-radius:6px;
  padding:13px 15px 15px;
}
.addout .addnote .ttl{color:var(--blue);font-size:12px}
.addout .addnote .ttl::before{color:var(--blue)}
section > h3{
  margin:0; padding:9px 15px; font-size:12px; font-weight:600; letter-spacing:.08em;
  color:var(--navy); background:var(--tint); border-bottom:1px solid var(--rule);
  border-radius:6px 6px 0 0;
}
.grid{display:grid;grid-template-columns:150px 1fr;gap:0}
.grid > div{padding:7px 15px;border-bottom:1px solid #f0f2f5}
.grid > div.k{color:var(--muted);font-size:12px;background:#fbfcfd}
.grid > div:nth-last-child(-n+2){border-bottom:none}
.v[contenteditable]{outline:none;min-height:1.7em;border-radius:3px;white-space:pre-wrap;word-break:break-word}
.v[contenteditable]:hover{background:#fafbfc;box-shadow:inset 0 0 0 1px var(--rule)}
.v[contenteditable]:focus{background:#fff;box-shadow:inset 0 0 0 2px var(--blue)}
.v.empty:not(:focus):before{content:"未入力";color:#b9c0c8}
.v.req.empty:not(:focus):before{content:"要記入";color:var(--warn)}
.v select{border:1px solid var(--rule);border-radius:3px;padding:2px 6px;background:#fff}
/* 見落とすと困る値は、枠ごと色を変えて目立たせる */
.v.flag-warn,.v.flag-off,.v.flag-key{padding-left:12px !important}
.v.flag-warn{background:#fff2dd;box-shadow:inset 4px 0 0 #dc9b34}
.v.flag-off {background:#edf0f3;box-shadow:inset 4px 0 0 #9aa7b4}
.v.flag-key {background:#e6effb;box-shadow:inset 4px 0 0 #4a86c8}
.v.flag-warn select{border-color:#dc9b34;color:#8a5000;font-weight:600;background:#fffaf2}
.v.flag-off  select{border-color:#b8c2cc;color:#4f5a66;font-weight:600;background:#f8f9fa}
.v.flag-key  select{border-color:#7ba7d7;color:#1f4e79;font-weight:600;background:#f4f8fd}

/* ---- notes ---- */
.note{padding:11px 15px;border-bottom:1px solid #f0f2f5}
.note:last-of-type{border-bottom:none}
.note.starred{background:#fffaf2;box-shadow:inset 4px 0 0 #dc9b34}
.nhead{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:5px}
.nstar{background:none;border:none;font-size:15px;line-height:1;padding:0 2px;color:#d5dae0;flex:none}
.nstar.on{color:#dc9b34}
.tag{font-size:11px;padding:2px 8px;border-radius:3px;background:var(--tint);color:var(--navy);white-space:nowrap}
.tag.kh{background:#e6effb;color:#1f4e79;font-weight:600}
.notag{font-size:11px;color:#a6aeb8}
/* 本文はふだん読むだけ。「編集」を押したときだけ contenteditable が付きます */
.note .body{white-space:pre-wrap;word-break:break-word;outline:none;border-radius:3px;padding:3px 5px;margin:0 -5px}
.note .body[contenteditable]{background:#fff;box-shadow:inset 0 0 0 2px var(--blue);cursor:text;padding:6px 8px;margin:0 -2px}
.note.editing{box-shadow:0 0 0 2px var(--blue),0 2px 8px rgba(31,78,121,.16) !important}

/* 編集中に出る 保存／取消 の行 */
.editrow{display:flex;gap:8px;align-items:center;margin-top:8px}
.editrow .save{border:1px solid var(--navy);background:var(--navy);color:#fff;border-radius:4px;padding:4px 15px;font-size:12px}
.editrow .cancel{border:1px solid var(--rule);background:#fff;color:var(--muted);border-radius:4px;padding:4px 13px;font-size:12px}
.editrow .note-hint{font-size:11px;color:#8a93a0}

/* 操作できないボタンは薄く。編集中は他の操作をいったん止めます */
.note button:disabled,.notefilter .tgl:disabled,.addnote button:disabled{opacity:.3;cursor:not-allowed}

/* リンクは本文の直下に、独立したボタンとして置きます */
.nlink{margin-top:8px}
.linkbtn{
  display:inline-flex;align-items:center;gap:5px;
  font-size:11px;padding:4px 11px;border-radius:4px;
  border:1px solid #a9c4e0;background:#fff;color:#1f4e79;
  text-decoration:none;font-weight:600;
}
.linkbtn:hover{background:#f2f7fc;border-color:#4a86c8}
.linkbtn.notion{border-color:#c2c6cc;color:#3a3f46}
.linkbtn.notion:hover{background:#f6f7f8;border-color:#8a9099}
.note .del{opacity:.5}
.note:hover .del{opacity:1}
.note .del{background:none;border:none;color:#c3cad2;font-size:15px;line-height:1;padding:2px 4px;margin-left:auto;flex:none}
.note .del:hover{color:var(--warn)}
/* 下段は「左＝操作」「右＝日付」に振り分けます */
.nfoot{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:9px;padding-top:8px;border-top:1px solid #eef1f4;font-size:11px;color:#8a93a0}
.nfoot .ops{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.nfoot .dates{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-left:auto;color:#a2aab4}
.nfoot .lnk2{background:none;border:none;color:var(--blue);font-size:11px;padding:0}
.nfoot .old{color:var(--warn)}
.notefilter{padding:8px 15px;display:flex;gap:5px;flex-wrap:wrap;border-bottom:1px solid var(--rule);background:#fbfcfd}
.tgl{font-size:11px;padding:3px 9px;border-radius:11px;border:1px solid var(--rule);background:#fff;color:var(--muted)}
.tgl.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.addnote{padding:12px 15px 14px;border-top:2px solid var(--rule);background:#eef1f5}
.addnote .ttl{
  font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.04em;
  margin-bottom:7px;display:flex;align-items:center;gap:6px;
}
.addnote .ttl::before{content:'＋';font-size:13px;color:var(--blue)}
.addnote textarea,.addnote input[type=text]{
  width:100%;box-sizing:border-box;border:1px solid var(--rule);border-radius:4px;
  padding:6px 9px;font:inherit;background:#fff;
}
.addnote textarea{resize:vertical;min-height:54px;line-height:1.6}
.addnote input[type=text]{margin-top:6px;font-size:12px}
.addnote .picks{display:flex;gap:5px;flex-wrap:wrap;margin:8px 0 0}
.addnote .arow{display:flex;gap:9px;align-items:center;margin-top:9px}
.addnote .go{border:1px solid var(--navy);background:var(--navy);color:#fff;border-radius:4px;padding:5px 16px;font-size:12px}
.addnote .hint{font-size:11px;color:var(--muted)}
.othbox{display:flex;gap:6px;align-items:center}
.othbox input{flex:1;min-width:70px;border:1px solid var(--rule);border-radius:3px;padding:2px 6px;font:inherit;background:#fff}

.empty-state{padding:70px 20px;text-align:center;color:var(--muted)}
#toast{
  position:fixed;bottom:22px;left:50%;transform:translateX(-50%);
  background:var(--navy);color:#fff;padding:9px 20px;border-radius:5px;font-size:13px;
  opacity:0;pointer-events:none;transition:opacity .22s;z-index:60;
  display:flex;align-items:center;gap:14px;max-width:92vw;
}
#toast.show{opacity:1}
#toast.act{pointer-events:auto}
#toast .undo{
  background:none;border:1px solid rgba(255,255,255,.55);color:#fff;
  border-radius:4px;padding:3px 11px;font-size:12px;white-space:nowrap;cursor:pointer;
}
#toast .undo:hover{background:rgba(255,255,255,.16)}

@media(max-width:820px){
  .wrap{display:block}
  #list{width:100%;height:auto;position:static;border-right:none;border-bottom:1px solid var(--rule)}
  #detail{height:auto;padding:16px}
  .grid{grid-template-columns:1fr}
  .grid > div.k{padding-bottom:0;border-bottom:none}
  body.viewing #list{display:none}
  body.viewing #back{display:inline-block}
  .othbox{flex-wrap:wrap}
  .othbox input{width:100%;flex:none;margin-top:4px}
  .addnote .arow{flex-wrap:wrap}
}
/* ===== 閲覧モード（ふだんの表示）===== */
.vhead{display:flex;align-items:flex-start;gap:16px;margin-bottom:14px}
.vhead .vt{flex:1;min-width:0}
.vhead .vname{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.vhead .vno{font-size:13px;color:var(--navy);background:#e4ecf5;border-radius:4px;padding:1px 8px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.vhead .vno.none{color:#8a93a0;background:#eef1f4;font-weight:400}
.vhead h2{font-size:22px !important;color:var(--ink) !important;font-weight:700 !important;margin:0 !important;padding:0 !important}
.vmeta{font-size:12px;color:#566170;margin-top:4px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.vmeta .badge{margin-right:0}
.editbtn{background:var(--navy);color:#fff;border:none;border-radius:6px;padding:9px 18px;font-size:13px;font-weight:700;white-space:nowrap;flex:none}
.editbtn:hover{background:#163a5b}
.editbtn.ghost{background:#fff;color:var(--navy);border:1px solid #a9c4e0}
.editbtn.ghost:hover{background:#f2f7fc}
.editbar{display:flex;align-items:center;gap:12px;background:#e4ecf5;border:1px solid #bcd2ec;border-radius:6px;padding:8px 12px;margin-bottom:14px;font-size:12px;color:var(--navy)}
.editbar span{flex:1}

.staffs{display:flex;gap:10px;margin-bottom:14px}
.staffs .s{flex:1;min-width:0;background:#fff;border:1px solid #dde2e8;border-radius:8px;padding:8px 14px}
.staffs .s .r{font-size:11px;color:#566170;letter-spacing:.04em}
.staffs .s .n{font-size:18px;font-weight:700;line-height:1.5}
.staffs .s .n.none{font-size:13px;font-weight:400;color:#8a93a0;padding-top:4px}
.staffs .s .n.req{color:var(--warn)}

.alert{background:#fff4e0;border:1px solid #efd3a4;border-radius:10px;padding:13px 16px 15px;margin-bottom:12px}
.alert .ah{display:flex;align-items:baseline;gap:10px;margin-bottom:9px;flex-wrap:wrap}
.alert .ah b{font-size:16px;color:#9a4a06}
.alert .ah span{font-size:12px;color:#566170}
.alert .sub2{font-size:12px;font-weight:700;color:#9a4a06;margin:12px 0 6px}
.alert.calm{background:#f7f8f9;border-color:#e1e5ea;padding:10px 16px}
.alert.calm .ah{margin:0}
.alert.calm .ah b{font-size:13px;color:#566170}
.astar{display:flex;gap:10px;align-items:flex-start;background:#fff;border:1px solid #efd3a4;border-radius:6px;padding:9px 12px;margin-bottom:6px}
.astar:last-of-type{margin-bottom:0}
.astar .mk{color:#d18a1f;font-size:16px;line-height:1.5;flex:none}
.astar .bd{flex:1;min-width:0;font-size:15px;font-weight:600;white-space:pre-wrap;word-break:break-word;line-height:1.6}
.astar .side{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex:none}
.astar .side .tags{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.astar .side .lnk2{background:none;border:none;color:var(--blue);font-size:11px;padding:0}

    const h = new Headers((init && init.headers) || (typeof input !== 'string' && input.headers) || {});

async function rest(path, opts){
  opts = Object.assign({}, opts);
  opts.headers = Object.assign({'Content-Type':'application/json'}, opts.headers||{});
  const r = await fetch(SUPABASE_URL + '/rest/v1/' + path, opts);
  if(!r.ok) throw new Error(await r.text());
  if(r.status === 204) return null;
  const t = await r.text();
  return t ? JSON.parse(t) : null;
}

};
async function cleanup(){
  const gone = ['nyuryoku','shikyu','karte_no','roumu_name','team','shime_raw'];
  let n = 0;
  for(const c of clients){
    let hit = false;
    gone.forEach(k=>{ if(k in c){ delete c[k]; hit = true; } });
    Object.entries(OBSOLETE).forEach(([k,bad])=>{
      if(c[k] && bad(c[k])){ c[k] = ''; hit = true; }
    });
    if(hit){ n++; await saveClient(c, true); }
  }
  if(n) toast('使わなくなった項目を'+n+'社ぶん片づけました');
  await migrateNotes();
}

/* カテゴリ廃止にともなう引っ越し。「進行中の課題」だったものに★を付けます（1回だけ動きます） */
async function migrateNotes(){
  const old = notes.filter(n=>n.cat);
  if(!old.length) return;
  let star = 0;
  for(const n of old){
    if(n.cat === ALERT_CAT) star++;
    n.cat = '';
    if(remote){
      try{ await rest('client_notes?id=eq.'+n.id, {method:'PATCH', body:JSON.stringify({data:noteData(n)})}); }
      catch(e){ console.error(e); toast('特記事項の引っ越しに失敗しました'); return; }
    }
  }
  if(!remote) local.flush();
  toast('特記事項'+old.length+'件を新しい形に移しました'+(star?'（うち'+star+'件に★）':''));
}

    catch(e){ console.error(e); toast('追加できませんでした'); return false; }
  }
  clients.push(c);
  if(!remote) local.flush();
  return true;
}

async function deleteClient(c){
  if(remote){
    try{
      try{ await rest(LOG_TABLE+'?client_id=eq.'+encodeURIComponent(c.id), {method:'DELETE'}); }catch(e){ console.warn(e); }
      await rest('client_notes?client_id=eq.'+encodeURIComponent(c.id), {method:'DELETE'});
      await rest('clients?id=eq.'+encodeURIComponent(c.id), {method:'DELETE'});
    }catch(e){ console.error(e); toast('削除できませんでした'); return false; }
  }
  clients = clients.filter(x=>x.id!==c.id);
  notes = notes.filter(n=>n.client!==c.id);
  openLogs = openLogs.filter(l=>l.client!==c.id);
  if(!remote){ local.flush(); localLogsLoad(); localLogs = localLogs.filter(r=>r.client_id!==c.id); localLogsSave(); }
  return true;
}

async function addNote(clientId, src){
  const n = noteFrom(null, clientId, src);
  if(!n.created) n.created = today();   /* 元に戻したときは、当時の日付を保ちます */
  if(!n.checked) n.checked = today();
  if(remote){
    try{
      const rows = await rest('client_notes', {method:'POST', headers:{Prefer:'return=representation'},
        body: JSON.stringify({client_id:clientId, data:noteData(n)})});
      n.id = rows[0].id;
      notes.push(n);
    }catch(e){ console.error(e); toast('追加できませんでした'); return; }
  } else {
    n.id = Date.now(); notes.push(n); local.flush();
  }
  toast('特記事項を追加しました');
}
/* 中身を直したら、確認日も今日にします（人が手で維持しなくて済むように） */
async function updateNote(n, quiet){
  n.checked = today();
  if(!n.created) n.created = today();
  if(remote){
    try{ await rest('client_notes?id=eq.'+n.id, {method:'PATCH', body:JSON.stringify({data:noteData(n)})}); }
    catch(e){ console.error(e); toast('保存できませんでした'); return; }
  } else local.flush();
  if(!quiet) toast('保存しました');
}
async function removeNote(n){
  if(remote){
    try{ await rest('client_notes?id=eq.'+n.id, {method:'DELETE'}); }
    catch(e){ console.error(e); toast('削除できませんでした'); return; }

/* このファイルに埋め込まれたデータを、いま動いているデータへ取り込む */
function diffSeed(SRC){
  const fill=[], over=[], add=[];
  const skip = new Set(['id','sources','kenpo_denshi']);
  SRC.clients.forEach(s=>{
    const c = clients.find(x=>x.id===s.id) || clients.find(x=>x.name===s.name);
    if(!c){ add.push(s); return; }
    Object.keys(s).forEach(k=>{
      if(skip.has(k) || typeof s[k]!=='string' || !s[k]) return;
      const cur = c[k]||'';
      if(!cur) fill.push({c,k,v:s[k]});
      else if(cur!==s[k]) over.push({c,k,v:s[k],cur});
    });
  });
  const newNotes = (SRC.notes||[]).filter(n=>{
    const c = clients.find(x=>x.id===n.client);
    if(!c) return false;
    return !notes.some(o=>o.client===n.client && o.body===n.body);
  });
  return {fill,over,add,newNotes};
}

const KUBUN_ORDER = ['手続き・給与計算','給与計算','手続き','相談顧問'];
function sortRows(rows){
  const byName=(a,b)=>a.name.localeCompare(b.name,'ja');
  if(state.sort==='team'){
    const rank=c=>{const i=STAFF.indexOf(c.shutan||''); return i<0?(c.shutan?900:999):i;};
    return rows.slice().sort((a,b)=>rank(a)-rank(b) || (a.shutan||'').localeCompare(b.shutan||'','ja') || byName(a,b));
  }
  if(state.sort==='kubun'){
    const rank=c=>{const i=KUBUN_ORDER.indexOf(c.kubun||''); return i<0?99:i;};
    return rows.slice().sort((a,b)=>rank(a)-rank(b) || byName(a,b));
  }
  if(state.sort==='wage_no'){
    /* 数字は数として、数字でないものは文字として並べます。未入力は最後 */
    const key=c=>{
      const v=String(c.wage_no||'').trim();
      if(!v) return [2,0,''];
      return /^\d+$/.test(v) ? [0,parseInt(v,10),''] : [1,0,v];
    };
    return rows.slice().sort((a,b)=>{
      const x=key(a), y=key(b);
      return x[0]-y[0] || x[1]-y[1] || String(x[2]).localeCompare(String(y[2]),'ja') || byName(a,b);
    });
  }
  return rows.slice().sort(byName);
}

function filtered(){
  const q = state.q.trim().toLowerCase();
  return clients.filter(c=>{
    if(state.kubun && c.kubun!==state.kubun) return false;
    if(state.hoken && c.hokensha!==state.hoken) return false;
    if(state.jimu && c.jimu!==state.jimu) return false;
    if(state.staff==='__none__' && staffOf(c).length) return false;
    if(state.staff && state.staff!=='__none__' && !hasStaff(c,state.staff)
       && !(state.follow && isFollow(c,state.staff))) return false;
    if(state.wage && !c.wage_no) return false;
    if(state.gap && !gapsOf(c).length) return false;
    if(state.note && !notesOf(c.id).length) return false;
    if(q){
      const hay = [c.name,c.wage_no,c.shutan,c.fukutan,c.follow,c.madoguchi,c.dare,c.k_to,c.d_to,c.sokyu,c.bikou]
        .concat(notesOf(c.id).map(n=>n.body))
        .concat(notesOf(c.id).flatMap(n=>n.tags)).join(' ').toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
}

          ${state.sort==='wage_no' ? `<span class="wno ${c.wage_no?'':'none'}">${esc(c.wage_no||'—')}</span>` : ''}
          <span class="nm">${esc(c.name)}</span>
        </div>
        <div class="rsub">
          ${openBy[c.id] ? `<span class="fg td" title="対応中のやりとり">要対応${openBy[c.id]}</span>` : ''}
          ${flags}
          <span class="tm ${tm?'':'none'}">${esc(tm||'未設定')}</span>
          <span class="kb">${esc(c.kubun||'—')}</span>
        </div>
      </div>
    </div>`;
  });
  document.getElementById('list').innerHTML = html || '<div class="empty-state">該当する顧問先がありません。</div>';

  document.querySelectorAll('.row').forEach(r=>{
    r.onclick=()=>{
      if(bulk){
        const id=r.dataset.id;
        picked.has(id) ? picked.delete(id) : picked.add(id);
        render(); return;
      }
      const hit = clients.find(c=>c.id===r.dataset.id);
      if(hit) openClient(hit, sel===hit ? detailTab : 'karte');
    };
  });
  if(bulk) syncBulk();
  renderDetail();
}

function syncBulk(){
  const n = picked.size;
  const go = document.getElementById('bulkGo');
  go.textContent = '選択した' + n + '社に反映';
  go.disabled = !n;
  document.getElementById('bulkN').textContent = n ? '' : '左の一覧をクリックして選びます';
}

async function applyBulk(){
  const v1 = document.getElementById('bulk1').value;
  const v2 = document.getElementById('bulk2').value;
  const v3 = document.getElementById('bulk3').value;
  if(v1==='__keep__' && v2==='__keep__' && v3==='__keep__'){ toast('割り当てる担当を選んでください'); return; }
  const ids = [...picked];
  let ok = 0;
  for(const id of ids){
    const c = clients.find(x=>x.id===id);
    if(!c) continue;
    if(v1!=='__keep__') c.shutan = v1;
    if(v2!=='__keep__') c.fukutan = v2;
    if(v3!=='__keep__') c.follow = v3;
    if(await saveClient(c, true)) ok++;
  }
  picked.clear();
  toast(ok + '社の担当を更新しました');
  render();
}

/* 見落とすと困る値は色を付けて目立たせる */
const FLAG = {
  sho:      {'自社で手続き':'warn','対象外':'off'},
  koyo:     {'自社で手続き':'warn','対象外':'off'},
  hokensha: {'健保組合':'key'},
};
const flagOf = (key,val) => (FLAG[key]||{})[val] || '';

/* 「その他」を選ぶと自由に入力できる項目。他社で入力された値も選択肢に並びます */
function optsFor(key, val){
  const base = (OPTS[key]||[]).filter(o=>o!==OTHER);
  const extras = [...new Set(clients.map(x=>x[key]).filter(v=>v && !base.includes(v)))]
                   .sort((a,b)=>String(a).localeCompare(String(b),'ja'));
  const list = base.concat(extras);
  if(val && !list.includes(val)) list.push(val);
  return list.concat(OTHER);
}

function field(c,key,label,opts,req){
  const val = c[key]||'';
  const fl = flagOf(key,val);
  if(opts && OTHER_FIELDS.includes(key)){
    const list = optsFor(key, val);
    return `<div class="k">${label}</div><div class="v${fl?' flag-'+fl:''}"><div class="othbox">`+
      `<select data-k="${key}">`+
      list.map(o=>`<option value="${esc(o)}"${o===val?' selected':''}>${esc(o||'—')}</option>`).join('')+
      `</select><input type="text" data-oth="${key}" placeholder="内容を入力" style="display:none">`+
      `</div></div>`;
  }
  if(opts){
    return `<div class="k">${label}</div><div class="v${fl?' flag-'+fl:''}"><select data-k="${key}">`+
      opts.map(o=>`<option value="${esc(o)}"${o===val?' selected':''}>${esc(o||'—')}</option>`).join('')+
      `</select></div>`;
  }
  return `<div class="k">${label}</div>`+
    `<div class="v${val?'':' empty'}${req?' req':''}" contenteditable data-k="${key}">${esc(val)}</div>`;
}

/* ===== 閲覧表示 ===== */
/* 「いつもと違う設定」。標準（事務所で一番多いやり方）と違う値だけを拾います */
const EXC = [
  {k:'sho',      l:'社保手続き',       x:v=>v && v!=='当事務所で手続き'},
  {k:'koyo',     l:'雇保手続き',       x:v=>v && v!=='当事務所で手続き'},
  {k:'hokensha', l:'保険者',           x:v=>v==='健保組合', sub:c=>c.kenpo_name},
  {k:'kojo',     l:'社保料控除',       x:v=>v && v!=='翌月'},
  {k:'roudou',   l:'離職票・年更',     x:v=>v && v!=='調整なし'},
  {k:'k_how',    l:'社保控除表の送付', x:v=>v && v!=='メール'},
  {k:'d_how',    l:'公文書の送付',     x:v=>v && v!=='メール'},
  {k:'sokyu',    l:'総支給額の定義',   x:v=>!!v},
];
const QUICK_FIELDS = [
  {l:'顧問区分', v:c=>c.kubun},
  {l:'締め／払い', v:c=>[c.shime?c.shime+'締め':'', c.harai?c.harai+'払い':''].filter(Boolean).join('・')},
  {l:'保険者', v:c=>c.hokensha==='健保組合' && c.kenpo_name ? c.kenpo_name : c.hokensha},
  {l:'連絡窓口', v:c=>c.madoguchi},
  {l:'連絡方法', v:c=>c.renraku},
  {l:'回収', v:c=>c.keiro},
];
const isExc = (k,v) => { const e = EXC.find(x=>x.k===k); return !!(e && e.x(v)); };

const VIEW_SECTIONS = [
  ['基本情報',   [['wage_no','事業所No'],['kubun','顧問区分'],['madoguchi','連絡窓口'],['renraku','連絡方法'],
                  ['sho','社保手続き'],['koyo','雇保手続き']]],
  ['社会保険',   [['hokensha','保険者'],['kenpo_name','健保組合名'],['jimu','事務組合'],['kojo','社保料控除月']]],
  ['賃金入力',   [['shime','締日'],['harai','支払日'],['roudou','離職票・年更'],['sokyu','総支給額の定義']]],
  ['回収と送付', [['keiro','回収経路'],['dare','回収先（誰から）'],['keishiki','データ形式'],['hozon','保存先'],
                  ['k_to','社保控除表の送付先'],['k_how','社保控除表の送付方法'],
                  ['d_to','公文書の送付先'],['d_how','公文書の送付方法'],['bikou','備考']]],
];
/* 空でも「未入力」と数えない項目（空＝標準、または書くことがない） */
const OPTIONAL_EMPTY = ['sokyu','bikou','follow','fukutan'];
function emptyFields(c){
  const out = [];
  const add = (k,l) => { if(!c[k]) out.push({k,l,req:REQUIRED.includes(k)}); };
  add('shutan','担当①');
  VIEW_SECTIONS.forEach(([,rows])=>rows.forEach(([k,l])=>{
    if(OPTIONAL_EMPTY.includes(k)) return;
    if(k==='kenpo_name' && c.hokensha!=='健保組合') return;
    add(k,l);
  }));
  return out.sort((a,b)=>b.req-a.req);
}

function viewHtml(c, gaps, ns, notesBlock){
  const empt  = emptyFields(c);
  /* よく見る項目。会社名のすぐ下に並べて、下の「基本情報」まで見に行かなくて済むようにします。
     並べる項目は QUICK_FIELDS で変えられます */
  const quick = QUICK_FIELDS.map(q=>[q.l, q.v(c)]).filter(([,v])=>v);
  const srcMissing = ['カルテ','賃金','ルーティング'].filter(s=>!(c.sources||[]).includes(s));

  const staffBox = (role, v, req) => `<div class="s"><div class="r">${role}</div>`+
    (v ? `<div class="n">${esc(v)}</div>`
       : `<div class="n none${req?' req':''}">${req?'要記入':'未設定'}</div>`)+`</div>`;

  const gapLine = empt.length ? `
  <div class="gapline"><span class="gd"></span>
    <span>未入力 ${empt.length}項目：${empt.map(e=>e.req?`<span class="rq">${esc(e.l)}（要記入）</span>`:esc(e.l)).join('・')}</span>
    <button id="gapEdit">まとめて入力</button></div>` : '';

  const cards = VIEW_SECTIONS.map(([title, rows])=>{
    let blank = 0;
    const body = rows.map(([k,l])=>{
      const v = c[k]||'';
      if(!v){ if(!OPTIONAL_EMPTY.includes(k) && !(k==='kenpo_name' && c.hokensha!=='健保組合')) blank++; return ''; }
      return `<div class="vrow"><div class="l">${l}</div><div class="v${isExc(k,v)?' x':''}">${esc(v)}</div></div>`;
    }).join('');
    return `<div class="vcard"><div class="ch"><b>${title}</b>${blank?`<span>未入力 ${blank}</span>`:''}</div>`+
      (body || `<div class="none">まだ入力がありません</div>`)+`</div>`;
  }).join('');

  return `
  <button id="back">← 一覧へ</button>
  <div class="vhead">
    <div class="vt">
      <div class="vname">
        <span class="vno ${c.wage_no?'':'none'}">No.${esc(c.wage_no||'未設定')}</span>
        <h2>${esc(c.name)}</h2>
      </div>
      ${srcMissing.length ? `<div class="vmeta">${srcMissing.map(s=>`<span class="badge w">${esc(s)}に未登録</span>`).join('')}</div>` : ''}
    </div>
    <button class="editbtn" id="toEdit">編集する</button>
  </div>
  ${quick.length ? `<div class="quick">${quick.map(([l,v])=>`<div class="q"><span class="l">${esc(l)}</span><span class="v">${esc(v)}</span></div>`).join('')}</div>` : ''}
  ${tabsHtml(c, ns)}
  ${detailTab!=='karte' ? '' : `${openStrip(c)}
  <div class="staffs">
    ${staffBox('担当①', c.shutan, true)}
    ${staffBox('担当②', c.fukutan)}
    ${staffBox('フォロー（不在時）', c.follow)}
  </div>
  ${notesBlock}
  ${gapLine}
  <div class="vcards">${cards}</div>`}`;
}

function renderDetail(){
  const d = document.getElementById('detail');

  const c = sel, gaps = gapsOf(c), ns = notesOf(c.id);
  const srcMissing = ['カルテ','賃金','ルーティング'].filter(s=>!(c.sources||[]).includes(s));
  const usedTags  = TAGS.filter(t=>ns.some(n=>n.tags.includes(t)));
  const untagged  = ns.filter(n=>!n.tags.length).length;
  const starN   = ns.filter(n=>n.star).length;
  const excs    = EXC.filter(e=>e.x(c[e.k]||''));
  /* 特記事項はぜんぶ1か所に出します。★は「上に固定」の印です。
     ★以外が多いときだけ、NOTE_FOLD件まで見せて残りは「続きを見る」でたたみます */
  const tagOk = n => !noteFilter || noteFilter==='__all__' || noteFilter==='__star__'
                  || (noteFilter==='__none__' ? !n.tags.length : n.tags.includes(noteFilter));
  const hit   = ns.filter(n => noteEditOpen===String(n.id) || tagOk(n));
  const pinned = hit.filter(n=>n.star), others = hit.filter(n=>!n.star);
  const folding = !editMode && !noteFilter && !noteMore && others.length > NOTE_FOLD + 1;
  const othersShown = folding
    ? others.filter((n,i)=> i < NOTE_FOLD || noteEditOpen===String(n.id) || tagEditOpen===String(n.id) || noteOpen===String(n.id))
    : others;
  const hiddenN = others.length - othersShown.length;
  const noteCard = n => {
    const id = String(n.id);
    if(!editMode && !n.star && noteEditOpen!==id && tagEditOpen!==id && noteOpen!==id){
      const first = n.body.split('\n')[0];

        <div class="tagedit" style="display:${tagEditOpen===String(n.id)?'block':'none'}">

            `<button class="tgl ${n.tags.includes(t)?'on':''}" data-t="${esc(t)}"${off}>${esc(t)}</button>`).join('')}</div>
        </div>

            ${!editMode && !n.star && !editing ? `<button class="lnk2 nclose"${off}>▴ 1行に戻す</button>` : ''}
          </div>

            ${n.created ? `<span>記録 ${esc(n.created)}</span>` : ''}
            ${n.checked ? `<span class="${age!==null&&age>365?'old':''}">確認 ${esc(n.checked)}${age!==null&&age>365?'（1年以上前）':''}</span>` : ''}

      <div class="excwrap"><div class="sub2">いつもと違う設定 <small>カルテの項目から自動で表示</small></div>

               (sub ? `<div class="s2">${esc(sub)}</div>` : '')+`</div>`;}).join('')}</div></div>`;
  const listHtml = (pinned.length || othersShown.length || excHtml)

    if(!confirm(c.name + ' を削除します。\n特記事項もまとめて消え、元に戻せません。よろしいですか？')) return;
    if(!await deleteClient(c)) return;
    sel = null; document.body.classList.remove('viewing');
    refreshStaffSelects(); render(); toast(c.name + ' を削除しました');
  };

  const goEdit = ()=>{ editMode = true; detailTab = 'karte'; renderDetail(); d.scrollTop = 0; };
  d.querySelector('#toEdit') && (d.querySelector('#toEdit').onclick = goEdit);
  d.querySelector('#gapEdit') && (d.querySelector('#gapEdit').onclick = goEdit);
  /* 入力欄にカーソルがあるまま押すと、先に保存→描き直しが走ってクリックが空振りするため、
     押した瞬間にフォーカスが移らないようにしておきます */
  d.querySelector('#toView') && (d.querySelector('#toView').onmousedown = e=>e.preventDefault());
  d.querySelector('#toView') && (d.querySelector('#toView').onclick = ()=>{
    /* 入力中の欄があれば、先に保存（blur）させてから閲覧に戻します */
    if(document.activeElement && d.contains(document.activeElement)) document.activeElement.blur();
    editMode = false; render(); d.scrollTop = 0;
  });
  d.querySelector('#back').onclick=()=>{
    if(noteEditOpen && noteDraft.trim() !== (ns.find(x=>String(x.id)===noteEditOpen)||{}).body
       && !confirm('編集中の特記事項があります。保存せずに一覧へ戻りますか？')) return;
    noteEditOpen=null; noteDraft=''; noteFocus=false;
    document.body.classList.remove('viewing');sel=null;render();
  };

  d.querySelectorAll('[contenteditable][data-k]').forEach(el=>{
    /* 改行してよい欄（総支給額の定義・備考）は改行を残し、それ以外は1行にまとめます。
       以前は textContent で読んでいたため、Enterで入れた改行が保存時に消えていました */
    const multi = MULTILINE.includes(el.dataset.k);
    if(!multi) el.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); el.blur(); } });
    el.addEventListener('blur',()=>{
      let v = el.innerText.replace(/\u00a0/g,' ').replace(/\r/g,'');
      v = multi ? v.split('\n').map(x=>x.replace(/\s+$/,'')).join('\n').replace(/\n{3,}/g,'\n\n').trim()
                : v.replace(/\s*\n\s*/g,' ').trim();
      if(v === (c[el.dataset.k]||'')) return;
      if(el.dataset.k==='name' && !v){ el.textContent = c.name; toast('会社名は空にできません'); return; }
      c[el.dataset.k]=v; saveClient(c); render();
    });
  });
  d.querySelectorAll('select[data-k]').forEach(el=>{
    el.onchange=()=>{
      const k = el.dataset.k;
      if(OTHER_FIELDS.includes(k) && el.value===OTHER){
        const inp = el.parentElement.querySelector('input[data-oth]');
        inp.style.display=''; inp.value=''; inp.focus();
        return;                      /* 入力されるまでは保存しません */
      }
      c[k]=el.value;
      saveClient(c); render();
    };
  });
  d.querySelectorAll('input[data-oth]').forEach(el=>{
    const commit=()=>{
      const v = el.value.trim();
      if(!v){ renderDetail(); return; }      /* 空のままなら元に戻します */
      c[el.dataset.oth]=v;
      saveClient(c); render();
    };
    el.addEventListener('blur', commit);
    el.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); commit(); } });
  });
  /* 場面タグでの絞り込み */
  d.querySelectorAll('.notefilter .tgl').forEach(el=>{
    el.onclick=()=>{ noteFilter = el.dataset.nf; renderDetail(); };
  });
  d.querySelectorAll('[data-nrow]').forEach(r=>{
    r.onclick = ()=>{ if(noteEditOpen) return; noteOpen = r.dataset.nrow; tagEditOpen = null; renderDetail(); };
  });
  d.querySelectorAll('.nclose').forEach(b=>{
    b.onclick = ()=>{ noteOpen = null; tagEditOpen = null; renderDetail(); };
  });
  const nm = d.querySelector('#nMore'); if(nm) nm.onclick = ()=>{ noteMore = true; renderDetail(); };
  const nl = d.querySelector('#nLess'); if(nl) nl.onclick = ()=>{ noteMore = false; renderDetail(); };
  const no = d.querySelector('#naOpen');
  if(no) no.onclick = ()=>{ noteAddOpen = true; renderDetail(); const t = d.querySelector('#nb'); if(t){ t.focus(); t.scrollIntoView({block:'center'}); } };
  const nc = d.querySelector('#naClose'); if(nc) nc.onclick = ()=>{ noteAddOpen = false; renderDetail(); };

  d.querySelectorAll('.note[data-nid]').forEach(el=>{
    const n = ns.find(x=>String(x.id)===el.dataset.nid);
    if(!n) return;

    /* 本文（改行そのまま）。ふだんは読むだけで、「編集」を押したときだけ書き換えられます */
    const editBtn = el.querySelector('.nedit');
    if(editBtn) editBtn.onclick=()=>{
      noteEditOpen = String(n.id);
      noteDraft = n.body;
      noteFocus = true;
      renderDetail();
    };

    const bodyEl = el.querySelector('.body');
    if(noteEditOpen === String(n.id)){
      const readDraft = () => bodyEl.innerText.replace(/\u00a0/g,' ');
      /* 打ちかけを控えておくので、途中で画面が描き直されても消えません */
      bodyEl.addEventListener('input', ()=>{ noteDraft = readDraft(); });

      const finish = () => { noteEditOpen = null; noteDraft = ''; };

      const save = () => {
        const v = readDraft().trim();
        if(!v){ toast('本文は空にできません。削除するときは×から'); bodyEl.focus(); return; }
        if(v === n.body){ finish(); renderDetail(); return; }
        const before = n.body;
        n.body = v;
        finish();
        updateNote(n, true).then(()=>{
          render();
          toast('保存しました', ()=>{ n.body = before; updateNote(n, true).then(render); });
        });
      };
      const cancel = () => {
        if(readDraft().trim() !== n.body && !confirm('編集した内容を取り消します。よろしいですか？')) return;
        finish(); renderDetail();
      };

      el.querySelector('.save').onclick = save;
      el.querySelector('.cancel').onclick = cancel;
      bodyEl.addEventListener('keydown', e=>{
        if(e.key === 'Escape'){ e.preventDefault(); cancel(); }
      });

      /* 「編集」を押した直後だけ、文末にカーソルを置きます */
      if(noteFocus){
        noteFocus = false;
        bodyEl.focus();
        const r = document.createRange(); r.selectNodeContents(bodyEl); r.collapse(false);
        const s = getSelection(); s.removeAllRanges(); s.addRange(r);
      }
    }

    /* ★の付け外し */
    el.querySelector('.nstar').onclick=()=>{
      n.star = !n.star;
      if(!n.star) noteOpen = String(n.id);
      updateNote(n, true).then(()=>{ render(); });
    };

    /* タグの編集 */
    el.querySelector('.etag').onclick=()=>{
      tagEditOpen = (tagEditOpen===String(n.id)) ? null : String(n.id);
      renderDetail();
    };
    el.querySelectorAll('.tagedit .tgl').forEach(b=>{
      b.onclick=()=>{
        const t = b.dataset.t;
        n.tags = n.tags.includes(t) ? n.tags.filter(x=>x!==t) : n.tags.concat(t);
        updateNote(n, true).then(()=>{ renderDetail(); });
      };
    });

    /* リンク */
    const lb = el.querySelector('.elink');
    if(lb) lb.onclick=()=>{
      const v = prompt('リンク（NotionやOneDriveのURL）を貼ってください。空にすると外れます。', n.link||'');
      if(v===null) return;
      n.link = v.trim();
      updateNote(n, true).then(renderDetail);
    };

    el.querySelector('.del').onclick=()=>{
      const preview = n.body.length>24 ? n.body.slice(0,24)+'…' : n.body;
      if(!confirm('この特記事項を削除しますか？\n\n「'+preview+'」')) return;
      const backup = noteData(n), cid = n.client;
      removeNote(n).then(()=>{
        render();
        toast('削除しました', ()=>{ addNote(cid, backup).then(render); });
      });
    };
  });

  /* 新規追加 */
  d.querySelectorAll('[data-newtag]').forEach(b=>{
    b.onclick=()=>b.classList.toggle('on');
  });
  if(d.querySelector('#tagCfg')) d.querySelector('#tagCfg').onclick = tagDialog;
  if(d.querySelector('#na')) d.querySelector('#na').onclick=()=>{
    const body = d.querySelector('#nb').value.trim();
    if(!body){ toast('本文を入力してください'); return; }
    const tags = [...d.querySelectorAll('[data-newtag].on')].map(b=>b.dataset.newtag);
    addNote(c.id, {
      body, tags,
      star: d.querySelector('#nstarnew').checked,
      link: d.querySelector('#nlink').value.trim()
    }).then(()=>{ noteFilter=''; noteAddOpen=false; render(); toast('特記事項を追加しました'); });
  };
  bindTabs(d);
  bindLogs(d, c);
}

/* =====================================================================
   対応履歴（電話・メール・打合せなどのやりとりの記録）
   - 1件ずつ「未対応 → 対応中 → 完了」。完了したものは下の「履歴」に小さくしまいます
   - 消さずに残す（削除は入力ミス用。削除済みの印を付けて見えなくするだけ）
   - 「対応する人」を自分以外にすると伝言になり、本人が「確認しました」を押すまで未読と出ます
   - 画面を開くたびに全件は読みません：未完了の分（全社）＋開いた会社の履歴を20件ずつ
   ===================================================================== */
const LOG_TABLE = 'client_logs_test';   /* 動作確認が済んだら 'client_logs' に変えて本番テーブルへ */
const LOG_KINDS = ['電話','メール','打合せ','来所','その他'];
const LOG_ICON  = {'電話':'📞','メール':'✉️','打合せ':'🤝','来所':'🏢','その他':'📝'};
const LOG_PAGE  = 20;      /* 履歴を一度に読む件数 */
const LOG_ADMIN = ['志田'];  /* 誰の記録でも削除・復元できる人 */
const HIST_PEEK = 5;       /* 履歴をたたんでいるときに見せる件数 */

let detailTab = 'karte';  /* 'karte' | 'notes' | 'logs' */
let openLogs  = [];       /* 未完了の記録（全社分）。件数バッジと「わたしの要対応」に使います */
let logsReady = false;
const hist = {};          /* 顧問先ごとの完了済み履歴 {items, more, loading, key, err} */
let logUI = {kind:'', q:'', histOpen:false, trash:false};
const trash = {};   /* 顧問先ごとの削除した記録 */
let logExpand = null;     /* 履歴の中で開いている1件 */
let ME = '';              /* この端末で「わたし」として選んだ担当者 */
let localLogs = [], localLogsLoaded = false;

const pad2 = n => String(n).padStart(2,'0');
const nowIso = () => new Date().toISOString();
const byAtDesc = (a,b) => String(b.at||'').localeCompare(String(a.at||''));
const isOpenLog = l => !l.deleted && l.status !== '完了';
const isUnread  = l => !!l.to && l.to !== l.by && !l.read_at;
const isAdmin   = () => !!ME && LOG_ADMIN.includes(ME);
const canDelLog = l => !!ME && (l.by === ME || isAdmin());
const clientOf  = id => clients.find(c=>c.id===id);
const mdOf = s => { const p = String(s||'').split('-'); return p.length===3 ? (+p[1])+'/'+(+p[2]) : s; };

function toLocalInput(iso){
  const t = new Date(iso || Date.now());
  return t.getFullYear()+'-'+pad2(t.getMonth()+1)+'-'+pad2(t.getDate())+'T'+pad2(t.getHours())+':'+pad2(t.getMinutes());
}
function fmtAt(iso, dateOnly){
  const t = new Date(iso);
  if(isNaN(t)) return '';
  const y = t.getFullYear() !== new Date().getFullYear() ? t.getFullYear()+'/' : '';
  return y + (t.getMonth()+1)+'/'+t.getDate() + (dateOnly ? '' : ' '+pad2(t.getHours())+':'+pad2(t.getMinutes()));
}
function dueInfo(l){
  if(!l.due || l.status==='完了') return null;
  const t = today();
  if(l.due < t)   return {cls:'late',  txt:'期限切れ '+mdOf(l.due)};
  if(l.due === t) return {cls:'today', txt:'今日まで'};
  return {cls:'', txt:'期限 '+mdOf(l.due)};
}
const summaryOf = l => l.title || (l.body||'').split('\n')[0] || '（内容なし）';

/* 保存の形（Supabaseの列名）⇔ 画面で使う形 */
function logFrom(r){
  return {
    id:r.id, client:r.client_id, at:r.at||'', kind:r.kind||'その他',
    party:r.party||'', title:r.title||'', body:r.body||'',
    by:r.by_staff||'', to:r.to_staff||'', read_at:r.read_at||'',
    status:r.status||'完了', due:r.due||'', done_at:r.done_at||'',
    deleted:!!r.deleted, deleted_by:r.deleted_by||'', deleted_at:r.deleted_at||'',
    created_at:r.created_at||''
  };
}
function logRow(l){
  return {
    client_id:l.client, at:l.at, kind:l.kind, party:l.party, title:l.title, body:l.body,
    by_staff:l.by, to_staff:l.to, read_at:l.read_at||null,
    status:l.status, due:l.due||null, done_at:l.done_at||null,
    deleted:!!l.deleted, deleted_by:l.deleted_by||'', deleted_at:l.deleted_at||null,
    updated_at:nowIso()
  };
}

/* ---------- 読み込み ---------- */
function localLogsSave(){ try{ localStorage.setItem(LS+'logs_v1', JSON.stringify(localLogs)); }catch(e){} }
function localLogsLoad(){
  if(localLogsLoaded) return;
  let saved = null;
  try{ saved = JSON.parse(localStorage.getItem(LS+'logs_v1')||'null'); }catch(e){ saved = null; }
  localLogs = Array.isArray(saved) ? saved : (DEMO ? demoLogs() : []);
  if(!Array.isArray(saved) && DEMO) localLogsSave();
  localLogsLoaded = true;
}

async function loadOpenLogs(){
  if(remote){
    try{
      const rows = await rest(LOG_TABLE+'?select=*&deleted=is.false&status=neq.'+encodeURIComponent('完了')
                              +'&order=at.desc&limit=1000');
      openLogs = (rows||[]).map(logFrom);
      logsReady = true;
    }catch(e){
      console.error(e); openLogs = []; logsReady = false;
    }
  } else {
    localLogsLoad();
    openLogs = localLogs.map(logFrom).filter(isOpenLog).sort(byAtDesc);
    logsReady = true;
  }
}

const histKey = () => logUI.kind + '|' + logUI.q;
async function loadHist(cid){
  let h = hist[cid];
  if(!h || h.key !== histKey()) h = hist[cid] = {items:[], more:true, loading:false, key:histKey(), err:false};
  if(h.loading || !h.more) return;
  h.loading = true;
  const off = h.items.length;
  try{
    let got;
    if(remote){
      let q = LOG_TABLE+'?select=*&client_id=eq.'+encodeURIComponent(cid)
            + '&deleted=is.false&status=eq.'+encodeURIComponent('完了');
      if(logUI.kind) q += '&kind=eq.'+encodeURIComponent(logUI.kind);
      const w = logUI.q.replace(/[(),*%]/g,' ').trim();
      if(w) q += '&or=(' + ['title','body','party'].map(f=>f+'.ilike.'+encodeURIComponent('*'+w+'*')).join(',') + ')';
      q += '&order=at.desc&offset='+off+'&limit='+LOG_PAGE;
      got = ((await rest(q))||[]).map(logFrom);
    } else {
      localLogsLoad();
      const w = logUI.q.toLowerCase();
      got = localLogs.map(logFrom)
        .filter(l=>l.client===cid && !l.deleted && l.status==='完了'
          && (!logUI.kind || l.kind===logUI.kind)
          && (!w || (l.title+' '+l.body+' '+l.party).toLowerCase().includes(w)))
        .sort(byAtDesc).slice(off, off+LOG_PAGE);
    }
    if(hist[cid] !== h) return;          /* 読み込み中に絞り込みが変わった */
    h.items = h.items.concat(got);
    h.more = got.length === LOG_PAGE;
  }catch(e){
    console.error(e); h.err = true; h.more = false;
  }
  h.loading = false;
}

/* ---------- 書き込み ---------- */
async function saveLog(l, isNew){
  const row = logRow(l);
  if(remote){
    if(isNew){
      const r = await rest(LOG_TABLE, {method:'POST', headers:{Prefer:'return=representation'}, body:JSON.stringify(row)});
      l.id = r[0].id;
    } else {
      const r = await rest(LOG_TABLE+'?id=eq.'+l.id, {method:'PATCH', headers:{Prefer:'return=representation'}, body:JSON.stringify(row)});
      if(!r || !r.length) throw new Error('記録が見つかりませんでした（ほかの人が削除した可能性があります）');
    }
  } else {
    localLogsLoad();
    if(isNew){
      l.id = Date.now();
      localLogs.push(Object.assign({id:l.id, created_at:nowIso()}, row));
    } else {
      const i = localLogs.findIndex(x=>x.id===l.id);
      if(i>=0) localLogs[i] = Object.assign({}, localLogs[i], row);
    }
    localLogsSave();
  }
}
async function writeLog(l, isNew, msg, undo){
  try{ await saveLog(l, isNew); }
  catch(e){ console.error(e); toast('保存できませんでした：'+String(e.message||e).slice(0,60)); return false; }
  await loadOpenLogs();
  delete hist[l.client];
  if(logUI.trash) await loadTrash(l.client);
  render();
  if(msg) toast(msg, undo);
  return true;
}

async function setLogStatus(l, s){
  const before = {status:l.status, done_at:l.done_at};
  l.status = s;
  l.done_at = s==='完了' ? nowIso() : '';
  if(s==='完了') logExpand = null;
  await writeLog(l, false,
    s==='完了' ? '完了にしました（下の履歴にしまいました）' : '「'+s+'」にしました',
    s==='完了' ? ()=>{ l.status = before.status; l.done_at = before.done_at; writeLog(l, false, '元に戻しました'); } : null);
}
async function markLogRead(l){
  l.read_at = nowIso();
  await writeLog(l, false, '確認済みにしました');
}
async function deleteLog(l){
  if(!canDelLog(l)){ toast('削除できるのは記録した本人と管理者だけです'); return; }
  if(!confirm('この記録を削除しますか？\n\n「'+summaryOf(l).slice(0,30)+'」\n\n※入力ミスのときだけ使ってください。対応が終わったものは「完了」にします。')) return;
  l.deleted = true; l.deleted_by = ME; l.deleted_at = nowIso();
  delete trash[l.client];
  await writeLog(l, false, '削除しました', ()=>restoreLog(l));
}
async function restoreLog(l){
  l.deleted = false; l.deleted_by = ''; l.deleted_at = '';
  delete trash[l.client];
  await writeLog(l, false, '元に戻しました');
}
async function loadTrash(cid){
  try{
    let got;
    if(remote){
      got = ((await rest(LOG_TABLE+'?select=*&client_id=eq.'+encodeURIComponent(cid)
              +'&deleted=is.true&order=deleted_at.desc.nullslast&limit=100'))||[]).map(logFrom);
    } else {
      localLogsLoad();
      got = localLogs.map(logFrom).filter(l=>l.client===cid && l.deleted)
        .sort((a,b)=>String(b.deleted_at||'').localeCompare(String(a.deleted_at||'')));
    }
    trash[cid] = {items:got, err:false};
  }catch(e){ console.error(e); trash[cid] = {items:[], err:true}; }
}

/* ---------- わたし ---------- */
function initMe(){
  try{ ME = localStorage.getItem(LS+'me') || ''; }catch(e){ ME = ''; }
  if(DEMO && !ME) ME = DEMO_STAFF[0];
  if(ME && STAFF.length && !STAFF.includes(ME)) ME = '';
  fillMe();
}
function fillMe(){
  const s = document.getElementById('meSel');
  if(!s) return;
  s.innerHTML = '<option value="">（選ぶ）</option>'
    + STAFF.map(n=>`<option value="${esc(n)}"${n===ME?' selected':''}>${esc(n)}</option>`).join('');
}
function myLists(){
  const mine = openLogs.filter(l => l.to===ME || (!l.to && l.by===ME));
  const unread = mine.filter(l => l.to===ME && isUnread(l));
  const late = mine.filter(l => !unread.includes(l) && l.due && l.due < today());
  const due0 = mine.filter(l => !unread.includes(l) && l.due === today());
  const rest = mine.filter(l => !unread.includes(l) && !late.includes(l) && !due0.includes(l));
  const pair = openLogs.filter(l => !mine.includes(l) && (c=>c && hasStaff(c,ME))(clientOf(l.client)));
  const sent = openLogs.filter(l => l.by===ME && l.to && l.to!==ME && !l.read_at);
  return {mine, unread, late, due0, rest, pair, sent};
}
function syncTodoBtn(){
  const b = document.getElementById('myTodo');
  if(!b) return;
  if(!ME || !logsReady){ document.getElementById('myTodoN').textContent = '—'; b.classList.remove('hot'); return; }
  const m = myLists();
  document.getElementById('myTodoN').textContent = m.mine.length;
  b.classList.toggle('hot', !!(m.unread.length || m.late.length));
}

/* ---------- タブ ---------- */
function tabsHtml(c, ns){
  const op = openLogs.filter(l=>l.client===c.id);
  const red = op.some(l => (l.to===ME && isUnread(l)) || (l.due && l.due < today()));
  return `<div class="tabs">
    <button class="tab ${detailTab==='karte'?'on':''}" data-tab="karte">カルテ</button>
    <button class="tab ${detailTab==='logs'?'on':''}" data-tab="logs">対応履歴${op.length?`<span class="tc warn${red?' red':''}">要対応 ${op.length}</span>`:''}</button>
  </div>`;
}
function bindTabs(d){
  d.querySelectorAll('.tab[data-tab]').forEach(b=>{
    b.onclick = ()=>{
      if(noteEditOpen){ toast('特記事項を編集中です。保存か取消をしてから切り替えてください'); return; }
      detailTab = b.dataset.tab;
      renderDetail(); d.scrollTop = 0;
    };
  });
  d.querySelectorAll('[data-gotab]').forEach(b=>{
    b.onclick = ()=>{ detailTab = b.dataset.gotab; renderDetail(); d.scrollTop = 0; };
  });
}
/* カルテ側に出す一行（忘れ防止） */
function openStrip(c){
  const op = openLogs.filter(l=>l.client===c.id);
  if(!op.length) return '';
  const late = op.filter(l=>l.due && l.due < today()).length;
  const unr  = op.filter(l=>l.to===ME && isUnread(l)).length;
  return `<div class="openstrip${late||unr?' red':''}">
    <span>📌 対応中のやりとりが <b>${op.length}件</b> あります${late?`（期限切れ ${late}件）`:''}${unr?`（あなた宛ての未読 ${unr}件）`:''}</span>
    <span class="o1">${esc(summaryOf(op[0]))}${op.length>1?' ほか':''}</span>
    <button data-gotab="logs">対応履歴を開く →</button>
  </div>`;
}

/* ---------- 対応履歴タブ ---------- */
function logCard(l, done){
  const di = dueInfo(l);
  const sc = {'未対応':'s0','対応中':'s1','完了':'s2'}[l.status] || 's2';
  const canRead = l.to===ME && isUnread(l);
  return `<div class="lg ${di&&di.cls==='late'?'late':''} ${canRead?'unread':''}" data-lid="${esc(String(l.id))}">
    <div class="lgh">
      <span class="kd">${LOG_ICON[l.kind]||'📝'} ${esc(l.kind)}</span>
      <span>${esc(fmtAt(l.at))}</span>
      ${l.party?`<span class="pt">相手：${esc(l.party)}</span>`:''}
      <span class="st ${sc}">${esc(l.status)}</span>
      ${di?`<span class="due ${di.cls}">${esc(di.txt)}</span>`:''}
      ${canDelLog(l) ? '<button class="lx ldel" title="削除（入力ミスのとき）">×</button>' : ''}
    </div>
    ${l.title?`<div class="lgt">${esc(l.title)}</div>`:''}
    ${l.body?`<div class="lgb">${esc(l.body)}</div>`:''}
    <div class="lgf">
      <span>記録：${esc(l.by||'—')}</span>
      ${l.to?`<span>対応：${esc(l.to)}${isUnread(l)?'<b class="unr">未読</b>':(l.to!==l.by&&l.read_at?' <span class="rdok">✓確認済み</span>':'')}</span>`:''}
      ${done&&l.done_at?`<span>完了 ${esc(fmtAt(l.done_at,true))}</span>`:''}
      <span class="sp"></span>
      ${canRead?'<button class="bs rd lread">確認しました</button>':''}
      ${!done && l.status==='未対応'?'<button class="bs ldoing">対応中にする</button>':''}
      ${!done?'<button class="bs pri ldone">✓ 完了</button>':'<button class="bs lreopen">未完了に戻す</button>'}
      <button class="lnk2 ledit">編集</button>
    </div>
  </div>`;
}

function logsHtml(c){
  if(!logsReady){
    return `<section class="lsec"><h3>対応履歴</h3><div class="lnone">
      対応履歴のテーブル（${esc(LOG_TABLE)}）に接続できませんでした。<br>
      Supabaseでテーブルを作成するSQLを実行してから、もう一度開いてください。</div></section>`;
  }
  const w = logUI.q.toLowerCase();
  const match = l => (!logUI.kind || l.kind===logUI.kind)
                  && (!w || (l.title+' '+l.body+' '+l.party).toLowerCase().includes(w));
  const op = openLogs.filter(l=>l.client===c.id && match(l))
    .sort((a,b)=> (a.due||'9999') .localeCompare(b.due||'9999') || byAtDesc(a,b));
  const h = hist[c.id] && hist[c.id].key===histKey() ? hist[c.id] : null;
  const items = h ? h.items : [];
  const showN = logUI.histOpen ? items.length : Math.min(HIST_PEEK, items.length);
  const filtering = !!(logUI.kind || logUI.q);

  return `
  <div class="logbar">
    <button class="add" id="lgAdd">＋ やりとりを記録</button>
    <div class="kfilter">
      <button class="tgl ${logUI.kind?'':'on'}" data-lk="">すべて</button>
      ${LOG_KINDS.map(k=>`<button class="tgl ${logUI.kind===k?'on':''}" data-lk="${esc(k)}">${LOG_ICON[k]} ${esc(k)}</button>`).join('')}
    </div>
    <input type="search" id="lgQ" placeholder="内容で検索（Enter）" value="${esc(logUI.q)}">
  </div>

  <section class="lsec">
    <h3>対応中・要対応（${op.length}）</h3>
    ${op.length ? op.map(l=>logCard(l,false)).join('')
      : `<div class="lnone">${filtering?'この絞り込みに当てはまる未完了の記録はありません。':'いま対応が必要なやりとりはありません。'}</div>`}
  </section>

  <section class="lsec hist">
    <h3>履歴（完了したもの）</h3>
    ${items.slice(0, showN).map(l => logExpand===String(l.id) ? logCard(l,true) : `
      <div class="lgr" data-lid="${esc(String(l.id))}">
        <span class="at">${esc(fmtAt(l.at,true))}</span>
        <span class="kd" title="${esc(l.kind)}">${LOG_ICON[l.kind]||'📝'}</span>
        <span class="sm">${esc(summaryOf(l))}${l.party?`<span class="pt2">／${esc(l.party)}</span>`:''}</span>
        <span class="by">${esc(l.by)}</span>
      </div>`).join('')}
    ${!h || (h.loading && !items.length) ? '<div class="lnone">読み込み中…</div>'
      : h.err ? '<div class="lnone">履歴を読み込めませんでした。</div>'
      : !items.length ? `<div class="lnone">${filtering?'この絞り込みに当てはまる履歴はありません。':'完了した記録はまだありません。'}</div>`
      : !logUI.histOpen && (items.length > HIST_PEEK || h.more) ? `<button class="lmore" id="lgHistOpen">すべての履歴を見る</button>`
      : logUI.histOpen && h.more ? `<button class="lmore" id="lgMore">${h.loading?'読み込み中…':'さらに20件を読み込む'}</button>`
      : logUI.histOpen && items.length > HIST_PEEK ? `<button class="lmore" id="lgHistClose">たたむ</button>` : ''}
  </section>
  ${isAdmin() ? trashHtml(c) : ''}`;
}
function trashHtml(c){
  if(!logUI.trash) return `<div class="trashlink"><button id="lgTrash">🗑 削除した記録を見る</button><span>（管理者だけに表示）</span></div>`;
  const t = trash[c.id];
  return `<section class="lsec trash"><h3>削除した記録 <small>管理者だけに表示。ここから元に戻せます</small>
      <button class="lnk2" id="lgTrashClose">閉じる</button></h3>
    ${!t ? '<div class="lnone">読み込み中…</div>'
      : t.err ? '<div class="lnone">読み込めませんでした。</div>'
      : !t.items.length ? '<div class="lnone">削除した記録はありません。</div>'
      : t.items.map(l=>`<div class="trow2" data-tid="${esc(String(l.id))}">
          <span class="at">${esc(fmtAt(l.at,true))}</span>
          <span class="kd">${LOG_ICON[l.kind]||'📝'}</span>
          <span class="sm">${esc(summaryOf(l))}<small>記録：${esc(l.by||'—')}</small></span>
          <span class="dl">${l.deleted_by?esc(l.deleted_by)+'さんが削除':'削除'}${l.deleted_at?' '+esc(fmtAt(l.deleted_at)):''}</span>
          <button class="bs lrestore">元に戻す</button>
        </div>`).join('')}
  </section>`;
}

function findLog(cid, id){
  return openLogs.find(l=>String(l.id)===id)
      || ((hist[cid]&&hist[cid].items)||[]).find(l=>String(l.id)===id);
}

function bindLogs(d, c){
  const add = d.querySelector('#lgAdd');
  if(!add) return;   /* 対応履歴タブを表示していない */
  add.onclick = ()=> logDialog(c, null);

  d.querySelectorAll('[data-lk]').forEach(b=>{
    b.onclick = ()=>{ logUI.kind = b.dataset.lk; logExpand = null; renderDetail(); };
  });
  const q = d.querySelector('#lgQ');
  q.addEventListener('keydown', e=>{
    if(e.key==='Enter'){ logUI.q = q.value.trim(); logExpand = null; renderDetail(); }
  });
  q.addEventListener('search', ()=>{ if(!q.value && logUI.q){ logUI.q=''; renderDetail(); } });

  d.querySelectorAll('.lgr[data-lid]').forEach(r=>{
    r.onclick = ()=>{ logExpand = r.dataset.lid; renderDetail(); };
  });
  d.querySelectorAll('.lg[data-lid]').forEach(el=>{
    const l = findLog(c.id, el.dataset.lid);
    if(!l) return;
    const on = (sel, fn) => { const b = el.querySelector(sel); if(b) b.onclick = e=>{ e.stopPropagation(); fn(); }; };
    on('.ldel',   ()=>deleteLog(l));
    on('.lread',  ()=>markLogRead(l));
    on('.ldoing', ()=>setLogStatus(l,'対応中'));
    on('.ldone',  ()=>setLogStatus(l,'完了'));
    on('.lreopen',()=>{ logExpand = null; setLogStatus(l,'対応中'); });
    on('.ledit',  ()=>logDialog(c, l));
  });
  const tb = d.querySelector('#lgTrash');
  if(tb) tb.onclick = ()=>{
    logUI.trash = true; delete trash[c.id]; renderDetail();
    loadTrash(c.id).then(()=>{ if(sel===c && detailTab==='logs') renderDetail(); });
  };
  const tc = d.querySelector('#lgTrashClose');
  if(tc) tc.onclick = ()=>{ logUI.trash = false; renderDetail(); };
  d.querySelectorAll('.trow2 .lrestore').forEach(b=>{
    b.onclick = async ()=>{
      const id = b.closest('.trow2').dataset.tid;
      const l = ((trash[c.id]||{}).items||[]).find(x=>String(x.id)===id);
      if(!l) return;
      await restoreLog(l);
      loadTrash(c.id).then(()=>{ if(sel===c && detailTab==='logs') renderDetail(); });
    };
  });
  if(logUI.trash && !trash[c.id]) loadTrash(c.id).then(()=>{ if(sel===c && detailTab==='logs') renderDetail(); });
  const ho = d.querySelector('#lgHistOpen');
  if(ho) ho.onclick = ()=>{ logUI.histOpen = true; renderDetail(); };
  const hc = d.querySelector('#lgHistClose');
  if(hc) hc.onclick = ()=>{ logUI.histOpen = false; logExpand = null; renderDetail(); };
  const mo = d.querySelector('#lgMore');
  if(mo) mo.onclick = ()=>{ loadHist(c.id).then(()=>{ if(sel===c && detailTab==='logs') renderDetail(); }); renderDetail(); };

  /* 履歴がまだ読めていなければ読みに行きます */
  const h = hist[c.id];
  if(!h || h.key!==histKey()){
    loadHist(c.id).then(()=>{ if(sel===c && detailTab==='logs' && !editMode) renderDetail(); });
  }
}

/* ---------- 記録の入力・編集 ---------- */
function logDialog(c, l){
  const isNew = !l;
  const v = l ? Object.assign({}, l)
              : {client:c.id, at:nowIso(), kind:'電話', party:'', title:'', body:'', by:ME, to:'', status:'完了', due:''};
  const need0 = isNew ? false : v.status!=='完了';
  const sOpt = (cur, blank) => `<option value="">${blank}</option>`
    + [...new Set([...STAFF, cur||''])].filter(Boolean)
      .map(n=>`<option value="${esc(n)}"${n===cur?' selected':''}>${esc(n)}</option>`).join('');

  const box = modal.open(`
    <h3>${isNew?'やりとりを記録':'記録を編集'}｜${esc(c.name)}</h3>
    <div class="in">
      <label>手段</label>
      <div class="kpick">${LOG_KINDS.map(k=>`<button type="button" class="tgl ${k===v.kind?'on':''}" data-kind="${esc(k)}">${LOG_ICON[k]} ${esc(k)}</button>`).join('')}</div>
      <div class="two">
        <div><label>日時</label><input type="datetime-local" id="lgAt" value="${esc(toLocalInput(v.at))}"></div>
        <div><label>記録した人</label><select id="lgBy">${sOpt(v.by,'（選ぶ）')}</select></div>
      </div>
      <label>相手（誰と）</label>
      <input type="text" id="lgParty" value="${esc(v.party)}" placeholder="例：総務の田中様">
      <label>件名（一覧に出る一行・任意）</label>
      <input type="text" id="lgTitle" value="${esc(v.title)}" placeholder="例：11月入社2名の資格取得">
      <label>内容</label>
      <textarea id="lgBody" rows="6" placeholder="聞いたこと・伝えたこと・決まったことなど">${esc(v.body)}</textarea>
      <div class="needbox">
        <label class="chk"><input type="checkbox" id="lgNeed"${need0?' checked':''}> このあと対応が必要（要対応にする）</label>
        <div id="lgNeedMore" style="display:${need0?'block':'none'}">
          <div class="two">
            <div><label>対応する人</label><select id="lgTo">${sOpt(v.to,'記録した人が対応')}</select></div>
            <div><label>期限（任意）</label><input type="date" id="lgDue" value="${esc(v.due||'')}"></div>
          </div>
          <p class="note" id="lgHint" style="margin:8px 0 0"></p>
        </div>
        <p class="note" id="lgNoNeed" style="margin:6px 0 0;display:${need0?'none':'block'}">チェックしない場合は「記録のみ」として、すぐ履歴に入ります。</p>
      </div>
    </div>
    <div class="foot">
      <span class="note" style="margin-right:auto;font-size:11px;color:#8a93a0;align-self:center">Ctrl＋Enterで保存</span>
      <button id="lgCancel">キャンセル</button>
      <button class="pri" id="lgSave">${isNew?'記録する':'保存'}</button>
    </div>`);
  box.classList.add('wide');

  let kind = v.kind;
  box.querySelectorAll('[data-kind]').forEach(b=>{
    b.onclick = ()=>{
      kind = b.dataset.kind;
      box.querySelectorAll('[data-kind]').forEach(x=>x.classList.toggle('on', x===b));
    };
  });
  const need = box.querySelector('#lgNeed'), more = box.querySelector('#lgNeedMore');
  const hint = ()=>{
    const by = box.querySelector('#lgBy').value, to = box.querySelector('#lgTo').value;
    box.querySelector('#lgHint').textContent = (to && to!==by)
      ? to+'さんへの伝言になります。'+to+'さんが「確認しました」を押すまで「未読」と表示されます。'
      : '自分の要対応として「わたしの要対応」に出ます。';
  };
  need.onchange = ()=>{ more.style.display = need.checked ? 'block' : 'none';
    box.querySelector('#lgNoNeed').style.display = need.checked ? 'none' : 'block'; hint(); };
  box.querySelector('#lgTo').onchange = hint;
  box.querySelector('#lgBy').onchange = hint;
  hint();

  const save = async ()=>{
    const body  = box.querySelector('#lgBody').value.replace(/\s+$/,'');
    const title = box.querySelector('#lgTitle').value.trim();
    const by    = box.querySelector('#lgBy').value;
    const atv   = box.querySelector('#lgAt').value;
    if(!body.trim() && !title){ toast('件名か内容を入れてください'); box.querySelector('#lgBody').focus(); return; }
    if(!by){ toast('記録した人を選んでください'); box.querySelector('#lgBy').focus(); return; }
    const at = atv ? new Date(atv) : new Date();
    const out = l || {client:c.id, deleted:false, read_at:'', done_at:''};
    const prevTo = out.to;
    out.kind = kind; out.at = isNaN(at) ? nowIso() : at.toISOString();
    out.party = box.querySelector('#lgParty').value.trim();
    out.title = title; out.body = body; out.by = by;
    if(need.checked){
      out.to  = box.querySelector('#lgTo').value;
      out.due = box.querySelector('#lgDue').value;
      if(isNew || out.status==='完了'){ out.status = '未対応'; out.done_at = ''; }
      if(isNew || out.to !== prevTo) out.read_at = '';
    } else {
      if(out.status !== '完了') out.done_at = nowIso();
      out.status = '完了'; out.to = ''; out.due = ''; out.read_at = '';
    }
    box.querySelector('#lgSave').disabled = true;
    const ok = await writeLog(out, isNew,
      isNew ? (need.checked ? '要対応として記録しました' : '記録しました（履歴に入れました）') : '保存しました');
    if(ok) modal.close();
    else box.querySelector('#lgSave').disabled = false;
  };
  box.querySelector('#lgSave').onclick = save;
  box.querySelector('#lgCancel').onclick = modal.close;
  box.addEventListener('keydown', e=>{ if(e.key==='Enter' && (e.ctrlKey||e.metaKey)){ e.preventDefault(); save(); } });
  (isNew ? box.querySelector('#lgParty') : box.querySelector('#lgBody')).focus();
}

  ];
  for(let i=0;i<26;i++){

    rows.push(R({client_id:'demo1', at:a, kind:p[0], party:'総務 田中様', title:p[1], body:p[2],

}

/* 「フォロー分も表示」は、特定の担当者を選んでいるときだけ押せます */
function syncFollowChip(){
  const b = document.getElementById('cFollow');
  const usable = !!state.staff && state.staff !== '__none__';
  b.disabled = !usable;
  if(!usable) state.follow = false;
  b.classList.toggle('on', state.follow);
}
document.getElementById('cFollow').onclick = ()=>{ state.follow = !state.follow; syncFollowChip(); render(); };
document.getElementById('sortBy').onchange = e=>{state.sort=e.target.value;render();};
document.getElementById('cBulk').onclick = e=>{
  bulk=!bulk; picked.clear();
  e.target.classList.toggle('on',bulk);
  document.getElementById('bulkbar').style.display = bulk?'flex':'none';
  document.body.classList.toggle('bulking',bulk);
  if(bulk){ sel=null; document.body.classList.remove('viewing'); }
  render();
};
document.getElementById('bulkGo').onclick = ()=>applyBulk();
document.getElementById('bulkAll').onclick = ()=>{ sortRows(filtered()).forEach(c=>picked.add(c.id)); render(); };
document.getElementById('bulkNone').onclick = ()=>{ picked.clear(); render(); };
[['cWage','wage'],['cGap','gap'],['cNote','note']].forEach(([id,k])=>{
  document.getElementById(id).onclick = e=>{ state[k]=!state[k]; e.target.classList.toggle('on',state[k]); render(); };
});

document.getElementById('csv').onclick = ()=>{
  const cols = [['name','会社名'],['wage_no','事業所No'],['kubun','顧問区分'],['shutan','担当①'],['fukutan','担当②'],['follow','フォロー（不在時）'],['madoguchi','連絡窓口'],
    ['renraku','連絡方法'],['sho','社保手続き'],['koyo','雇保手続き'],['hokensha','保険者'],
    ['kenpo_name','健保組合名'],['jimu','事務組合'],['kojo','社保料控除月'],['shime','締日'],['harai','支払日'],
    ['roudou','離職票・年更'],
    ['sokyu','総支給額の定義'],['keiro','回収経路'],['dare','回収先'],['keishiki','データ形式'],['hozon','保存先'],
    ['k_to','社保控除表の送付先'],['k_how','社保控除表の送付方法'],['d_to','公文書の送付先'],
    ['d_how','公文書の送付方法'],['bikou','備考']];
  const q = s => '"'+String(s==null?'':s).replace(/"/g,'""')+'"';
  const lines = [cols.map(c=>q(c[1])).concat(q('特記事項')).join(',')];
  sortRows(filtered()).forEach(c=>{
    const ns = notesOf(c.id).map(n=>
      (n.star?'★':'') + (n.tags.length?'['+n.tags.join(',')+'] ':'') + n.body
      + (n.link?' <'+n.link+'>':'')).join(' / ');
    lines.push(cols.map(col=>q(c[col[0]])).concat(q(ns)).join(','));
  });
  const blob = new Blob(['\uFEFF'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '顧客マスタ_'+new Date().toISOString().slice(0,10)+'.csv';
  a.click();
};

/* 見出し帯（ヘッダー＋絞り込み）が画面幅で2段になっても、一覧の上端がその下に来るようにします */
(function(){
  const hd = document.querySelector('header'), fl = document.querySelector('.filters'), bb = document.getElementById('bulkbar');
  const sync = ()=>{
    const r = document.documentElement.style;
    r.setProperty('--hh', hd.offsetHeight + 'px');
    r.setProperty('--stick', (hd.offsetHeight + fl.offsetHeight) + 'px');
    if(bb.offsetHeight) r.setProperty('--bb', bb.offsetHeight + 'px');
  };
  sync();
  if(window.ResizeObserver){ const ro = new ResizeObserver(sync); ro.observe(hd); ro.observe(fl); ro.observe(bb); }
  else window.addEventListener('resize', sync);
})();

boot();
