<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>手続きチェックリスト | SR Office</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Noto Sans JP',sans-serif;background:#F1F5F9;min-height:100vh;font-size:13px;color:#1E293B;}

/* ナビ */
#nav{background:#0F172A;height:50px;display:flex;align-items:center;padding:0 20px;gap:0;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.4);}
#nav .brand{color:#fff;font-size:14px;font-weight:700;padding-right:20px;border-right:1px solid rgba(255,255,255,.15);margin-right:8px;white-space:nowrap;}
.ntab{padding:0 18px;height:50px;display:flex;align-items:center;color:rgba(255,255,255,.6);font-size:12px;font-weight:500;cursor:pointer;border-bottom:3px solid transparent;transition:all .15s;white-space:nowrap;}
.ntab:hover{color:#fff;background:rgba(255,255,255,.06);}
.ntab.on{color:#fff;border-bottom-color:#3B82F6;background:rgba(59,130,246,.1);}
#nav .sync{margin-left:auto;font-size:10px;color:rgba(255,255,255,.45);}

/* レイアウト */
#app{display:flex;height:calc(100vh - 50px);}

/* サイドバー */
#sb{width:220px;background:#1E293B;flex-shrink:0;display:flex;flex-direction:column;overflow:hidden;}
#sb-top{padding:12px;border-bottom:1px solid rgba(255,255,255,.08);}
#btn-new{width:100%;background:#2563EB;border:none;color:#fff;padding:8px;border-radius:7px;cursor:pointer;font-size:12px;font-weight:700;font-family:inherit;transition:background .15s;}
#btn-new:hover{background:#1D4ED8;}
#sb-filter{padding:8px 12px 4px;display:flex;flex-direction:column;gap:3px;border-bottom:1px solid rgba(255,255,255,.08);}
.sf-btn{background:none;border:1px solid rgba(255,255,255,.1);color:rgba(255,255,255,.5);padding:4px 10px;border-radius:5px;cursor:pointer;font-size:10px;font-family:inherit;text-align:left;transition:all .12s;}
.sf-btn:hover{background:rgba(255,255,255,.06);color:rgba(255,255,255,.8);}
.sf-btn.on{border-color:transparent;color:#fff;font-weight:700;}
#sb-list{flex:1;overflow-y:auto;padding:6px 0;}
#sb-list::-webkit-scrollbar{width:3px;}
#sb-list::-webkit-scrollbar-thumb{background:#334155;}
.si{padding:8px 12px;cursor:pointer;border-left:3px solid transparent;transition:all .12s;}
.si:hover{background:rgba(255,255,255,.05);}
.si.on{background:rgba(37,99,235,.2);border-left-color:#3B82F6;}
.si-badge{font-size:9px;font-weight:700;padding:1px 6px;border-radius:8px;display:inline-block;margin-bottom:2px;}
.si-co{color:#F1F5F9;font-size:11px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.si-name{color:#94A3B8;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px;}
.si-row{display:flex;align-items:center;gap:4px;margin-top:3px;}
.si-pb{flex:1;background:rgba(255,255,255,.1);border-radius:2px;height:3px;overflow:hidden;}
.si-pf{height:100%;border-radius:2px;transition:width .3s;}
.si-pct{color:#94A3B8;font-size:9px;min-width:24px;text-align:right;}

/* メイン */
#main{flex:1;overflow:hidden;display:flex;flex-direction:column;}

/* ダッシュボード */
#vd{flex:1;overflow-y:auto;padding:18px 20px;}
#vd::-webkit-scrollbar{width:5px;}
#vd::-webkit-scrollbar-thumb{background:#CBD5E1;border-radius:3px;}
.vd-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.vd-head h2{font-size:16px;font-weight:700;color:#0F172A;}
/* サマリーは非表示（戻すときは display:none → display:grid） */
.summary{display:none;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:16px;}
.sm{background:#fff;border-radius:8px;padding:10px 14px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.07);}
.sm-n{font-size:22px;font-weight:700;}
.sm-l{font-size:10px;color:#64748B;margin-top:2px;}
.status-filters{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;}
.stf{padding:5px 12px;border-radius:16px;border:2px solid transparent;cursor:pointer;font-size:11px;font-weight:600;font-family:inherit;transition:all .15s;display:flex;align-items:center;gap:4px;}
.stf.off{background:#fff!important;color:#64748B!important;border-color:#E2E8F0!important;}
.stf-cnt{background:rgba(0,0,0,.12);border-radius:8px;padding:1px 6px;font-size:10px;}
/* 絞り込みバー */
.filter-bar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center;}
.filter-select{padding:5px 10px;border:1px solid #E2E8F0;border-radius:6px;font-size:12px;font-family:inherit;background:#fff;color:#475569;cursor:pointer;outline:none;}
.filter-select:focus{border-color:#2563EB;}
/* 絞り込みが効いているときだけ目立たせる */
.filter-clear{padding:5px 10px;border:1px solid #E2E8F0;border-radius:6px;font-size:11px;font-family:inherit;background:#fff;color:#94A3B8;cursor:pointer;display:inline-flex;align-items:center;gap:5px;transition:all .15s;}
.filter-clear:hover{background:#F1F5F9;color:#475569;}
.filter-clear.on{border-color:#EA580C;background:#FFF7ED;color:#C2410C;font-weight:700;box-shadow:0 0 0 3px rgba(234,88,12,.12);}
.filter-clear.on:hover{background:#FFEDD5;color:#9A3412;}
.fc-cnt{background:#EA580C;color:#fff;border-radius:8px;padding:0 6px;font-size:10px;line-height:15px;}
/* 選ばれている絞り込み自体も色を付ける */
.filter-select.on{border-color:#2563EB;background:#EFF6FF;color:#1D4ED8;font-weight:700;}
.filter-csv{padding:5px 12px;border:1px solid #059669;border-radius:6px;font-size:11px;font-family:inherit;background:#fff;color:#059669;cursor:pointer;font-weight:700;}
.filter-csv:hover{background:#ECFDF5;}
.age-badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:700;margin-left:5px;background:#F1F5F9;color:#64748B;vertical-align:middle;}
.apply-badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:700;margin-left:5px;background:#F1F5F9;color:#64748B;vertical-align:middle;white-space:nowrap;}
.proc-summary{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
.proc-chip{padding:4px 10px;border-radius:12px;font-size:11px;font-weight:600;cursor:pointer;border:2px solid transparent;transition:all .12s;}
.proc-chip.off{background:#fff!important;color:#64748B!important;border-color:#E2E8F0!important;}
.dash-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px;}
.dc{background:#fff;border-radius:10px;padding:14px;box-shadow:0 1px 4px rgba(0,0,0,.08);cursor:pointer;border:2px solid transparent;transition:all .15s;}
.dc:hover{transform:translateY(-1px);box-shadow:0 4px 14px rgba(0,0,0,.12);}
/* カード見出し：日付を主役に */
.dc-head{display:flex;align-items:flex-start;gap:12px;margin-bottom:9px;}
.dc-date{flex-shrink:0;width:66px;text-align:center;border-right:1px solid #E2E8F0;padding-right:10px;}
.dc-date-y{font-size:9px;color:#94A3B8;font-weight:600;}
.dc-date-md{font-size:22px;font-weight:700;color:#0F172A;line-height:1.12;letter-spacing:-.03em;}
.dc-date-w{font-size:9px;color:#64748B;margin-top:1px;}
.dc-date-l{font-size:9px;font-weight:700;margin-top:4px;padding:1px 0;border-radius:3px;}
.dc-date-2{font-size:10px;font-weight:600;color:#475569;margin-top:5px;padding-top:5px;border-top:1px dashed #E2E8F0;}
.dc-date-none{font-size:10px;color:#CBD5E1;padding:16px 0;}
.dc-inf{flex:1;min-width:0;}
.dc-proc{font-size:14px;font-weight:700;line-height:1.2;display:flex;align-items:center;gap:5px;flex-wrap:wrap;}
.dc-co{font-size:15px;font-weight:700;color:#0F172A;margin-top:5px;line-height:1.3;overflow-wrap:anywhere;}
.dc-sub{font-size:13px;font-weight:500;color:#475569;margin-top:3px;line-height:1.3;}
.badge-row{display:flex;gap:5px;flex-wrap:wrap;align-items:center;}
.dc-bar{background:#E2E8F0;border-radius:3px;height:5px;overflow:hidden;margin-top:10px;}
.dc-bar-fill{height:100%;border-radius:3px;transition:width .4s;}

/* 待ち中情報 */
.waiting-chips{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px;}
.wchip{font-size:9px;padding:2px 7px;border-radius:4px;background:#FFF7ED;color:#C2410C;border:1px solid #FED7AA;font-weight:600;}

/* ステータスドロップダウン */
/* 現在のステータス色をそのまま持つ（バッジは廃止） */
.dc-foot{display:flex;align-items:center;gap:6px;margin-top:8px;}
.st-sel{flex:1;min-width:0;font-size:11px;font-weight:700;font-family:inherit;border:1.5px solid;border-radius:6px;
        padding:4px 24px 4px 8px;cursor:pointer;appearance:none;-webkit-appearance:none;
        background-repeat:no-repeat;background-position:right 7px center;background-size:9px;transition:box-shadow .12s;}
.st-sel:hover{box-shadow:0 0 0 3px rgba(0,0,0,.05);}
.st-sel:focus{outline:none;box-shadow:0 0 0 3px rgba(0,0,0,.09);}
.st-sel option{background:#fff;color:#1E293B;font-weight:500;}

/* アクション */
/* アイコンのみ・右下に小さく */
.dc-acts{display:flex;gap:4px;justify-content:flex-end;}
.dc-btn{width:26px;height:26px;padding:0;font-size:12px;line-height:1;border:none;background:transparent;
        font-family:inherit;cursor:pointer;border-radius:6px;opacity:.45;transition:all .12s;
        display:flex;align-items:center;justify-content:center;}
.dc:hover .dc-btn{opacity:.8;}
.dc-btn:hover{opacity:1!important;transform:scale(1.12);}
.dc-open:hover{background:#EFF6FF;}
.dc-edit:hover{background:#F1F5F9;}
.dc-del:hover{background:#FEF2F2;}

/* チェックリスト */
#vc{flex:1;display:flex;flex-direction:column;overflow:hidden;}
#cl-head{background:#fff;padding:12px 18px;border-bottom:1px solid #E2E8F0;flex-shrink:0;}
.cl-r1{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap;}
.cl-back{background:#F1F5F9;border:none;color:#475569;padding:4px 10px;border-radius:5px;cursor:pointer;font-size:11px;font-family:inherit;}
.cl-back:hover{background:#E2E8F0;}
.cl-co{font-size:15px;font-weight:700;color:#0F172A;}
.cl-name{font-size:12px;color:#64748B;}
.cl-pct{font-size:18px;font-weight:700;margin-left:auto;}
.cl-bar{background:#E2E8F0;border-radius:3px;height:6px;overflow:hidden;}
.cl-bar-fill{height:100%;border-radius:3px;transition:width .4s;}
.cl-meta{display:flex;align-items:center;gap:12px;margin-top:6px;flex-wrap:wrap;}
.cl-meta .label{font-size:11px;color:#64748B;}

/* 待ち中パネル（チェックリスト上部） */
#wait-panel{padding:10px 18px;background:#FFFBEB;border-bottom:2px solid #FDE68A;flex-shrink:0;}
.wait-panel-title{font-size:11px;font-weight:700;color:#92400E;margin-bottom:8px;}
.wait-checks{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.wait-check{display:flex;align-items:center;gap:5px;font-size:11px;color:#78350F;cursor:pointer;}
.wait-check input{accent-color:#D97706;width:13px;height:13px;}
.wait-note{margin-top:8px;}
.wait-note label{font-size:10px;color:#92400E;display:block;margin-bottom:3px;}
.wait-note textarea{width:100%;font-size:11px;font-family:inherit;border:1px solid #FDE68A;border-radius:5px;padding:5px 8px;background:#FFFEF7;resize:vertical;min-height:36px;outline:none;color:#78350F;}

/* 担当者 */
#tantosha-panel{padding:8px 18px;background:#F0F9FF;border-bottom:1px solid #BAE6FD;flex-shrink:0;display:flex;align-items:center;gap:10px;}
.tanto-label{font-size:11px;color:#0369A1;font-weight:600;white-space:nowrap;}
.tanto-input{flex:1;max-width:200px;font-size:11px;font-family:inherit;border:1px solid #BAE6FD;border-radius:5px;padding:4px 8px;background:#fff;outline:none;color:#0369A1;}
.tanto-hist{font-size:10px;color:#64748B;flex:1;}
.tanto-hist span{background:#E0F2FE;color:#0369A1;padding:2px 7px;border-radius:4px;margin-right:4px;font-weight:600;}

/* チェックリスト本体 */
#cl-body{flex:1;overflow-y:auto;padding:10px 16px 20px;}
#cl-body::-webkit-scrollbar{width:5px;}
#cl-body::-webkit-scrollbar-thumb{background:#CBD5E1;border-radius:3px;}
.sec-head{display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:0 6px 6px 0;margin:8px 0 4px;}
.sec-title{font-weight:700;font-size:12px;}
.sec-cnt{margin-left:auto;font-size:10px;color:#64748B;font-weight:600;}
.task-card{background:#fff;border:1px solid #E2E8F0;border-radius:7px;margin-bottom:3px;overflow:hidden;transition:border-color .15s,background .15s;}
.task-card.done{background:#F0FDF4;border-color:#86EFAC;}
.task-row{display:flex;align-items:flex-start;padding:8px 10px;gap:7px;}
.task-num{min-width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;flex-shrink:0;margin-top:1px;}
.task-cb{margin-top:2px;width:14px;height:14px;cursor:pointer;flex-shrink:0;}
.task-info{flex:1;}
.task-label{color:#1E293B;font-weight:500;font-size:12px;line-height:1.4;}
.task-label.done{color:#166534;text-decoration:line-through;}
.task-warn{margin-top:3px;padding:3px 7px;background:#FFF7ED;border:1px solid #FED7AA;border-radius:3px;font-size:10px;color:#C2410C;line-height:1.5;}
.task-toggle{background:none;border:none;color:#94A3B8;font-size:12px;cursor:pointer;padding:0 3px;flex-shrink:0;}
.task-toggle:hover{color:#475569;}
.task-note{padding:5px 10px 7px 47px;background:#F8FAFC;border-top:1px solid #E2E8F0;font-size:11px;color:#475569;line-height:1.6;}
.empty-state{text-align:center;padding:60px 20px;color:#94A3B8;}
.empty-icon{font-size:40px;margin-bottom:12px;}
.empty-text{font-size:14px;font-weight:700;color:#475569;margin-bottom:6px;}

/* モーダル */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:300;padding:20px;}
.ov.hidden{display:none;}
.shoshiki-check{display:flex;align-items:flex-start;gap:8px;padding:7px 10px;border:1px solid #E2E8F0;border-radius:6px;cursor:pointer;transition:all .12s;}
.shoshiki-check:hover{border-color:#CBD5E1;background:#F8FAFC;}
.shoshiki-check.on{border-color:#DC2626;background:#FEF2F2;}
.shoshiki-check input{accent-color:#DC2626;margin-top:2px;flex-shrink:0;}
.shoshiki-check .sl{font-size:11px;font-weight:700;color:#DC2626;}
.shoshiki-check .sd{font-size:10px;color:#64748B;margin-top:1px;}
.mbox{background:#fff;border-radius:12px;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.3);width:100%;max-width:560px;max-height:88vh;overflow-y:auto;}
.mt{font-size:15px;font-weight:700;color:#0F172A;margin-bottom:16px;}
.fg{margin-bottom:12px;}
.fl{font-size:11px;color:#64748B;display:block;margin-bottom:3px;font-weight:600;}
.fi{width:100%;padding:7px 10px;border:1px solid #CBD5E1;border-radius:6px;font-size:12px;font-family:inherit;outline:none;transition:border-color .15s;}
.fi:focus{border-color:#2563EB;box-shadow:0 0 0 2px rgba(37,99,246,.12);}
.req{color:#DC2626;}
.pg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:4px;}
.po{padding:7px 9px;border:2px solid #E2E8F0;border-radius:7px;cursor:pointer;display:flex;align-items:center;gap:5px;background:#fff;font-family:inherit;font-size:11px;font-weight:500;color:#475569;transition:all .12s;text-align:left;}
.po:hover{border-color:#CBD5E1;background:#F8FAFC;}
.mbtns{display:flex;gap:8px;margin-top:16px;}
.bcn{flex:1;padding:8px;border:1px solid #CBD5E1;border-radius:6px;background:#fff;cursor:pointer;font-size:12px;font-family:inherit;}
.bcn:hover{background:#F8FAFC;}
.bsb{flex:1;padding:8px;border:none;border-radius:6px;background:#2563EB;color:#fff;cursor:pointer;font-size:12px;font-weight:700;font-family:inherit;}
.bsb:hover{background:#1D4ED8;}
.bsb:disabled{background:#CBD5E1;cursor:default;}

/* 用語集 */
.gl-box{max-height:70vh;overflow-y:auto;}
.gl-head{display:flex;align-items:center;margin-bottom:14px;}
.gl-head h3{flex:1;font-size:15px;font-weight:700;}
.gl-x{background:none;border:none;font-size:18px;cursor:pointer;color:#94A3B8;}
.gl-item{margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid #F1F5F9;}
.gl-item:last-child{border:none;}
.gl-term{font-weight:700;font-size:12px;color:#1E293B;margin-bottom:2px;}
.gl-def{font-size:11px;color:#64748B;line-height:1.6;}

/* トースト */
.toast{position:fixed;bottom:24px;right:24px;z-index:999;background:#0F172A;color:#fff;padding:10px 18px;border-radius:8px;font-size:12px;box-shadow:0 4px 20px rgba(0,0,0,.3);transform:translateY(20px);opacity:0;transition:all .3s;pointer-events:none;}
.toast.show{transform:translateY(0);opacity:1;}

/* フリータスク入力 */
.free-task-input{width:100%;font-size:12px;font-family:inherit;border:none;background:transparent;outline:none;color:#1E293B;font-weight:500;padding:0;}
.free-task-input::placeholder{color:#CBD5E1;}
.free-task-input:focus{background:#F8FAFC;border-radius:3px;padding:0 3px;}

/* 案件メモ */
#case-memo-panel{padding:8px 18px;background:#F8FAFC;border-bottom:1px solid #E2E8F0;flex-shrink:0;}
.case-memo-label{font-size:11px;color:#475569;font-weight:600;margin-bottom:4px;display:block;}
.case-memo-input{width:100%;font-size:11px;font-family:inherit;border:1px solid #E2E8F0;border-radius:5px;padding:5px 8px;background:#fff;resize:vertical;min-height:36px;outline:none;color:#334155;transition:border-color .15s;}
.case-memo-input:focus{border-color:#2563EB;}

/* タスク個別メモ */
.task-memo-wrap{padding:4px 10px 6px 47px;background:#FAFAFA;border-top:1px solid #F1F5F9;}
.task-memo-input{width:100%;font-size:10px;font-family:inherit;border:1px solid #E2E8F0;border-radius:4px;padding:3px 7px;background:#fff;outline:none;color:#475569;resize:none;min-height:28px;transition:border-color .15s;}
.task-memo-input:focus{border-color:#94A3B8;}
.task-memo-input::placeholder{color:#CBD5E1;}

/* レスポンシブ */
@media(max-width:800px){
  #sb{display:none;}
  .summary{grid-template-columns:repeat(3,1fr);}
}
</style>
</head>
<body>

<div id="nav">
  <div class="brand">⚖️ SR Office</div>
  <div class="ntab on" id="tab-cl" onclick="showView('d')">📁 手続きチェックリスト</div>
  <div class="ntab" id="tab-gl" onclick="openModal('ov-gl')">📖 用語集</div>
  <div style="display:flex;align-items:center;gap:6px;margin-left:auto;">
    <button onclick="backupData()" style="background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;padding:4px 12px;border-radius:5px;cursor:pointer;font-size:11px;font-family:inherit;transition:background .15s;" onmouseover="this.style.background='rgba(255,255,255,.2)'" onmouseout="this.style.background='rgba(255,255,255,.1)'">💾 データ保存</button>
    <label style="background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;padding:4px 12px;border-radius:5px;cursor:pointer;font-size:11px;font-family:inherit;transition:background .15s;" onmouseover="this.style.background='rgba(255,255,255,.2)'" onmouseout="this.style.background='rgba(255,255,255,.1)'">
      🔄 データ復元
      <input type="file" accept=".json" onchange="restoreData(event)" style="display:none;">
    </label>
    <div id="sync-status" class="sync">🔄 接続中...</div>
  </div>
</div>

<div id="app">
  <!-- サイドバー -->
  <div id="sb">
    <div id="sb-top">
      <button id="btn-new" onclick="openModal('ov-new')">＋ 新規案件</button>
    </div>
    <div id="sb-filter">
      <button class="sf-btn on" id="sf-all" onclick="setSbFilter('all')">すべて</button>
      <button class="sf-btn" id="sf-none" onclick="setSbFilter('none')" style="border-left:3px solid #6B7280;">未手続</button>
      <button class="sf-btn" id="sf-shinsei" onclick="setSbFilter('shinsei')" style="border-left:3px solid #EA580C;">申請待ち</button>

/* ============================================================
   ログイン機能（こころざし経営労務事務所 共通）
   - Supabase Auth のメール＋パスワードでログインします
   - ログイン状態は3つのシステムで共有されます
   - 既存の fetch を包んで、anonキーの代わりに
     ログイン後のアクセストークンを送ります
   ============================================================ */
const SR_AUTH = (function () {
  const BASE = SB_URL;
  const ANON = SB_KEY;
  const STORE = 'sr_kokoro_auth';
  const raw = window.fetch.bind(window);

  let sess = null;
  try { sess = JSON.parse(localStorage.getItem(STORE) || 'null'); } catch (e) { sess = null; }

  let waiters = [];
  const save = s => { sess = s; localStorage.setItem(STORE, JSON.stringify(s)); };
  const clear = () => { sess = null; localStorage.removeItem(STORE); };

  function store(j) {
    save({
      access_token: j.access_token,
      refresh_token: j.refresh_token,
      expires_at: Date.now() + (j.expires_in || 3600) * 1000,
      email: (j.user && j.user.email) || ''
    });
  }

  async function signIn(email, password) {
    const r = await raw(BASE + '/auth/v1/token?grant_type=password', {
      method: 'POST',
      headers: { apikey: ANON, 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: email, password: password })
    });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error_description || j.msg || j.message || 'ログインできませんでした');
    store(j);
    return j;
  }

  async function refresh() {
    if (!sess || !sess.refresh_token) { clear(); return null; }
    const r = await raw(BASE + '/auth/v1/token?grant_type=refresh_token', {
      method: 'POST',
      headers: { apikey: ANON, 'Content-Type': 'application/json' },
      body: JSON.stringify({ refresh_token: sess.refresh_token })
    });
    if (!r.ok) { clear(); return null; }
    const j = await r.json();
    store(j);
    return j.access_token;
  }

  async function token() {
    if (!sess) return null;
    if (Date.now() > sess.expires_at - 60000) return await refresh();
    return sess.access_token;
  }

  function signOut() {
    const t = sess && sess.access_token;
    clear();
    if (t) raw(BASE + '/auth/v1/logout', {
      method: 'POST', headers: { apikey: ANON, Authorization: 'Bearer ' + t }
    }).catch(() => {});
    location.reload();
  }

  /* ---------- ログイン画面 ---------- */
  const css = document.createElement('style');

  #sr-login button{width:100%;margin-top:20px;padding:10px;font-size:14px;

  #sr-login button:disabled{background:#9fb2c6;cursor:default}
  #sr-login .err{margin-top:14px;font-size:12px;color:#b45309;
    background:#fdf3e3;border-radius:4px;padding:8px 10px;display:none;line-height:1.6}
  #sr-logout{position:fixed;left:10px;bottom:10px;z-index:9998;
    font-size:11px;color:#6b7280;background:rgba(255,255,255,.92);
    border:1px solid #dfe4ea;border-radius:13px;padding:4px 11px;cursor:pointer;
    font-family:"Yu Gothic",YuGothic,Meiryo,sans-serif;line-height:1.6}
  #sr-logout:hover{color:#1F4E79;border-color:#2E75B6}
  @media print{#sr-logout{display:none}}`;
  document.head.appendChild(css);

  function showLogin() {
    if (document.getElementById('sr-login')) return;
    const el = document.createElement('div');

      '<div class="card">' +
      '<h2>こころざし経営労務事務所</h2>' +
      '<p class="lead">事務所のアカウントでログインしてください。</p>' +
      '<label for="sr-id">ログインID</label>' +
      '<input id="sr-id" type="text" autocomplete="username" autocapitalize="off" spellcheck="false">' +
      '<label for="sr-pw">パスワード</label>' +

      '<button id="sr-go">ログイン</button>' +

      if (!id || !pw) { err.textContent = 'ログインIDとパスワードを入力してください。'; err.style.display = 'block'; return; }

          ? 'ログインIDまたはパスワードが違います。'
          : ('ログインできませんでした：' + (e.message || e));
        err.style.display = 'block';
        btn.disabled = false; btn.textContent = 'ログイン';
        pwEl.value = ''; pwEl.focus();
      }
    }
    btn.onclick = go;
    [idEl, pwEl].forEach(x => x.addEventListener('keydown', e => { if (e.key === 'Enter') go(); }));
  }

  function mountLogout() {
    if (document.getElementById('sr-logout') || !sess) return;
    const b = document.createElement('button');
    b.id = 'sr-logout';
    b.textContent = (sess.email ? sess.email.split('@')[0] + ' ・ ' : '') + 'ログアウト';
    b.onclick = () => { if (confirm('ログアウトしますか？')) signOut(); };
    document.body.appendChild(b);
  }

  /* 有効なトークンを返す。未ログインならログイン画面を出して待つ */
  async function ready() {
    const t = await token();
    if (t) return t;
    showLogin();
    return new Promise(res => waiters.push(res));
  }

  /* ---------- fetch を包む ---------- */
  window.fetch = async function (input, init) {
    const url = typeof input === 'string' ? input : (input && input.url) || '';
    if (!url.startsWith(BASE) || url.indexOf('/auth/v1/') >= 0) return raw(input, init);

    init = Object.assign({}, init);
    const t = await ready();
    const h = new Headers((init && init.headers) || (typeof input !== 'string' && input.headers) || {});
    h.set('apikey', ANON);
    h.set('Authorization', 'Bearer ' + t);
    init.headers = h;

    let res = await raw(url, init);
    if (res.status === 401) {
      const t2 = await refresh();
      if (t2) { h.set('Authorization', 'Bearer ' + t2); res = await raw(url, init); }
      else { showLogin(); }
    }
    return res;
  };

  document.addEventListener('DOMContentLoaded', () => { sess ? mountLogout() : showLogin(); });
  if (document.readyState !== 'loading') { sess ? mountLogout() : showLogin(); }

  return { signIn, signOut, token, ready, get email() { return sess && sess.email; } };
})();



const SB_HEADERS = {
  'apikey': SB_KEY,
  'Authorization': 'Bearer ' + SB_KEY,
  'Content-Type': 'application/json'
};

async function sbGet() {
  try {
    const r = await fetch(`${SB_URL}/rest/v1/${TABLE}?select=*&order=created_at.asc`, { headers: SB_HEADERS });
    if (!r.ok) { const t = await r.text(); throw new Error(t); }
    return await r.json();
  } catch(e) { console.error('sbGet', e); return null; }
}

async function sbInsert(row) {
  try {
    const r = await fetch(`${SB_URL}/rest/v1/${TABLE}`, {
      method: 'POST',
      headers: { ...SB_HEADERS, 'Prefer': 'return=representation' },
      body: JSON.stringify(row)
    });
    if (!r.ok) { const t = await r.text(); throw new Error(t); }
    return (await r.json())[0];
  } catch(e) { console.error('sbInsert', e); return null; }
}

async function sbUpdate(id, data) {
  try {
    const r = await fetch(`${SB_URL}/rest/v1/${TABLE}?id=eq.${id}`, {
      method: 'PATCH',
      headers: { ...SB_HEADERS, 'Prefer': 'return=representation' },
      body: JSON.stringify(data)
    });
    if (!r.ok) { const t = await r.text(); throw new Error(t); }
    /* 更新できた行を返してもらいます。
       0件のときは対象の案件がDBに無いということなので、失敗を返します。
       PostgreSQLは0件更新でもエラーにならないため、ここを見ないと
       保存できていないのに「保存済」と表示されてしまいます。 */
    const rows = await r.json();
    if (!Array.isArray(rows) || rows.length === 0) {
      console.warn('sbUpdate: 対象の案件がDBにありません id=', id);
      return false;
    }
    return true;
  } catch(e) { console.error('sbUpdate', e); return false; }
}

/* 復元専用。案件がDBに無ければ、同じidで作り直します。
   id列は「指定があればそれを使う」設定にしてあるので、idを渡せます。
   通常の保存(saveCase)ではこれを使いません。削除済みの案件が
   他の人の保存操作で復活してしまうためです。 */
async function sbRestoreOne(row) {
  try {
    const r = await fetch(`${SB_URL}/rest/v1/${TABLE}`, {
      method: 'POST',
      headers: { ...SB_HEADERS, 'Prefer': 'resolution=merge-duplicates,return=representation' },
      body: JSON.stringify(row)
    });
    if (!r.ok) { const t = await r.text(); throw new Error(t); }
    const rows = await r.json();
    return Array.isArray(rows) && rows.length > 0;
  } catch(e) { console.error('sbRestoreOne', e); return false; }
}

async function sbDelete(id) {
  try {
    const r = await fetch(`${SB_URL}/rest/v1/${TABLE}?id=eq.${id}`, {
      method: 'DELETE', headers: SB_HEADERS
    });
    return r.ok;
  } catch(e) { console.error('sbDelete', e); return false; }
}

function gp(c) { return P[c.proc] || P['入社']; }
// タスク表示判定：扶養／月変／社保の各フラグを一元管理
function taskVisible(t, c) {
  return (!t.fuyoOnly     || c.hasFuyo     !== false)
      && (!t.tsukihenOnly || c.hasTsukihen !== false)
      && (!t.shahoOnly    || c.hasShaho    !== false);
}
function allTasks(c) {
  const p = gp(c);
  let sections = (p.isRousai && c.rousaiShoshiki && c.rousaiShoshiki.length > 0)
    ? p.sections.filter(s => !s.rousaiKey || c.rousaiShoshiki.includes(s.rousaiKey))
    : p.sections;
  const hasFuyo = c.hasFuyo !== false;
  // 賞与：計算なしの場合calcOnlyセクションをスキップ
  if (p.hasCalc && c.hasCalc === false) {
    sections = sections.filter(s => !s.calcOnly);
  }
  // 月変：月変なしの場合tsukihenOnlyセクションをスキップ
  if (c.hasTsukihen === false) {
    sections = sections.filter(s => !s.tsukihenOnly);
  }
  return sections.flatMap(s => s.tasks).filter(t => taskVisible(t, c));
}
function pct(c) { const a = allTasks(c); return a.length ? Math.round(a.filter(t => c.checks[t.id]).length / a.length * 100) : 0; }
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function today() { return new Date().toLocaleDateString('ja-JP',{year:'numeric',month:'long',day:'numeric',weekday:'long'}); }

async function loadData() {
  setSyncStatus('🔄 読み込み中...');
  const rows = await sbGet();
  if (rows === null) {
    setSyncStatus('❌ 接続失敗（ローカルで動作中）');
    const local = localStorage.getItem('cl-cases');
    if (local) cases = JSON.parse(local);
  } else {
    cases = rows.map(r => ({
      ...r,
      id: String(r.id),
      checks: r.checks || {},
      waitFlags: r.wait_flags || {},
      waitMemo: r.wait_memo || '',
      tantoLog: r.tanto_log || [],
      rousaiShoshiki: r.rousai_shoshiki || [],
      caseMemo: r.case_memo || '',
      taskMemos: r.task_memos || {},
      round: r.round || '',
      freeName: r.free_name || '',
      procDate: r.proc_date || '',
      procDate2: r.proc_date2 || '',
      hasFuyo: r.ha_fuyo !== false,
      hasCalc: r.has_calc !== null ? r.has_calc : null,
      hasTsukihen: r.has_tsukihen !== null ? r.has_tsukihen : null,
      hasShaho: r.has_shaho !== false,
      freeLabels: r.free_labels || {},
    }));
    _lastSync = Date.now();
    setSyncStatus('☁️ 同期済');
  }
  renderAll();
}

async function saveCase(c) {
  localStorage.setItem('cl-cases', JSON.stringify(cases));
  const payload = {
    company: c.company,
    name: c.name,
    proc: c.proc,
    free_name: c.freeName || '',
    proc_date: c.procDate || '',
    proc_date2: c.procDate2 || '',
    status: c.status,
    checks: c.checks,
    wait_flags: c.waitFlags || {},
    wait_memo: c.waitMemo || '',
    tanto_log: c.tantoLog || [],
    rousai_shoshiki: c.rousaiShoshiki || [],
    case_memo: c.caseMemo || '',
    task_memos: c.taskMemos || {},
    round: c.round || '',
    ha_fuyo: c.hasFuyo !== false,
    has_calc: c.hasCalc !== null ? c.hasCalc : null,
    has_shaho: c.hasShaho !== false,
    free_labels: c.freeLabels || {},
    updated_at: new Date().toISOString(),
  };
  const ok = await sbUpdate(c.id, payload);
  if (ok) { _lastSync = Date.now(); setSyncStatus('☁️ 保存済'); }
  else setSyncStatus('⚠️ 保存失敗（ローカルのみ）');
}

async function insertCase(c) {
  const payload = {
    company: c.company,
    name: c.name,
    proc: c.proc,
    free_name: c.freeName || '',
    proc_date: c.procDate || '',
    proc_date2: c.procDate2 || '',
    status: c.status || 'none',
    checks: c.checks || {},
    wait_flags: c.waitFlags || {},
    wait_memo: c.waitMemo || '',
    tanto_log: c.tantoLog || [],
    created_at: new Date().toISOString(),
    updated_at: new Date().toISOString(),
  };
  const row = await sbInsert(payload);
  if (row) {
    c.id = String(row.id);
    localStorage.setItem('cl-cases', JSON.stringify(cases));
    _lastSync = Date.now();
    setSyncStatus('☁️ 保存済');
    return true;
  }
  setSyncStatus('⚠️ 保存失敗（ローカルのみ）');
  return false;
}

async function removeCase(id) {
  cases = cases.filter(c => c.id !== id);
  localStorage.setItem('cl-cases', JSON.stringify(cases));
  await sbDelete(id);
  setSyncStatus('☁️ 削除済');
}

function setSyncStatus(msg) {
  document.getElementById('sync-status').textContent = msg;
}

function showView(v) {
  viewMode = v;
  document.getElementById('vd').style.display = v === 'd' ? '' : 'none';
  document.getElementById('vc').style.display = v === 'c' ? '' : 'none';
  if (v === 'd') renderDash();
  else renderChecklist();
}

function openChecklist(id) {
  currentId = id;
  expanded = {};
  showView('c');
  renderSidebar();
}

function setSbFilter(f) {
  sbFilter = f;
  ['all','none','shinsei','double','wait','kobunsho','done'].forEach(k => {
    const el = document.getElementById('sf-'+k);
    if (el) el.classList.toggle('on', k === f);
  });
  renderSidebar();
}

function renderSidebar() {
  const filtered = sbFilter === 'all' ? cases : cases.filter(c => (c.status||'none') === sbFilter);
  const el = document.getElementById('sb-list');
  if (!filtered.length) {
    el.innerHTML = '<div style="padding:12px;color:#64748B;font-size:10px;text-align:center;">該当する案件なし</div>';
    return;
  }
  el.innerHTML = filtered.map(c => {
    const p = gp(c), pt = pct(c), st = stInfo(c.status||'none');
    return `<div class="si${currentId===c.id&&viewMode==='c'?' on':''}" onclick="openChecklist('${c.id}')">
      <span class="si-badge" style="background:${p.color}22;color:${p.color}">${p.icon} ${c.freeName ? esc(c.freeName) : esc(c.proc)}</span>
      <div class="si-co">${esc(c.company)}</div>
      ${c.name ? `<div class="si-name">${esc(c.name)}</div>` : ''}
      <div class="si-row">
        <div class="si-pb"><div class="si-pf" style="width:${pt}%;background:${p.color}"></div></div>
        <span class="si-pct">${pt}%</span>
      </div>
    </div>`;
  }).join('');
}

function renderDash() {
  // 会社・手続きフィルターの選択肢を更新
  const companyEl = document.getElementById('company-filter');
  const procEl = document.getElementById('proc-filter');
  const tantoEl = document.getElementById('tanto-filter');
  const companyVal = companyEl ? companyEl.value : '';
  const procVal = procEl ? procEl.value : '';
  const tantoVal = tantoEl ? tantoEl.value : '';
  const companies = [...new Set(cases.map(c => c.company))].sort();
  const procs = [...new Set(cases.map(c => c.proc))].sort();
  const tantos = [...new Set(cases.flatMap(c => (c.tantoLog||[]).map(t => t.name)))].filter(Boolean).sort();
  if (companyEl) {
    companyEl.innerHTML = '<option value="">会社：すべて</option>' +
      companies.map(co => `<option value="${esc(co)}" ${co===companyVal?'selected':''}>${esc(co)}</option>`).join('');
  }
  if (procEl) {
    procEl.innerHTML = '<option value="">手続き：すべて</option>' +
      procs.map(pr => `<option value="${esc(pr)}" ${pr===procVal?'selected':''}>${esc(pr)}</option>`).join('');
  }
  if (tantoEl) {
    tantoEl.innerHTML = '<option value="">担当者：すべて</option>' +
      tantos.map(t => `<option value="${esc(t)}" ${t===tantoVal?'selected':''}>${esc(t)}</option>`).join('');
  }

  // 絞り込みが効いているかを見た目に反映
  [[companyEl, companyVal], [procEl, procVal], [tantoEl, tantoVal]].forEach(([el, v]) => {
    if (el) el.classList.toggle('on', !!v);
  });
  const activeCount = [companyVal, procVal, tantoVal].filter(Boolean).length + (dashFilter !== 'all' ? 1 : 0);
  const clearBtn = document.getElementById('btn-clear');
  if (clearBtn) {
    clearBtn.classList.toggle('on', activeCount > 0);
    clearBtn.innerHTML = activeCount > 0
      ? `✕ 絞り込みをリセット <span class="fc-cnt">${activeCount}</span>`
      : '絞り込みをリセット';
  }

  // 手続き別集計
  const procCounts = {};
  cases.forEach(c => { procCounts[c.proc] = (procCounts[c.proc]||0)+1; });
  document.getElementById('proc-summary').innerHTML = Object.entries(procCounts)
    .sort((a,b) => procOrder(a[0]) - procOrder(b[0]))
    .map(([pr, cnt]) => {
      const p = P[pr] || {color:'#6B7280', icon:'📋'};
      const on = procVal === pr;
      return `<span class="proc-chip${on?'':' off'}" style="background:${p.color}18;color:${p.color};border-color:${on?p.color:'transparent'}" onclick="setProcFilter('${esc(pr)}')">${p.icon} ${esc(pr)} ${cnt}</span>`;
    }).join('');

  const counts = {};
  STATUSES.forEach(s => counts[s.key] = 0);
  cases.forEach(c => { counts[c.status||'none'] = (counts[c.status||'none']||0)+1; });

  // サマリ
  document.getElementById('summary').innerHTML =
    `<div class="sm" style="border-top:3px solid #1E293B"><div class="sm-n">${cases.length}</div><div class="sm-l">全案件</div></div>` +
    STATUSES.map(s => `<div class="sm" style="border-top:3px solid ${s.color}">
      <div class="sm-n" style="color:${s.color}">${counts[s.key]||0}</div>
      <div class="sm-l">${s.label}</div>
    </div>`).join('');

  // フィルタボタン
  document.getElementById('status-filters').innerHTML =
    `<button class="stf${dashFilter==='all'?'':' off'}" style="background:#1E293B;color:#fff;border-color:#1E293B" onclick="setDashFilter('all')">すべて <span class="stf-cnt">${cases.length}</span></button>` +
    STATUSES.map(s => `<button class="stf${dashFilter===s.key?'':' off'}" style="background:${s.bg};color:${s.color};border-color:${s.color}" onclick="setDashFilter('${s.key}')">${s.label} <span class="stf-cnt">${counts[s.key]||0}</span></button>`).join('');

  // 絞り込み適用
  let filtered = cases;
  if (dashFilter !== 'all') filtered = filtered.filter(c => (c.status||'none') === dashFilter);
  if (companyVal) filtered = filtered.filter(c => c.company === companyVal);
  if (procVal) filtered = filtered.filter(c => c.proc === procVal);
  if (tantoVal) filtered = filtered.filter(c => (c.tantoLog||[]).some(t => t.name === tantoVal));

  // 並べ替え
  const ageOf = c => { const d = daysSince(c.created_at); return d === null ? -1 : d; };
  filtered = filtered.slice().sort((a,b) => {
    if (dashSort === 'apply')   return applyInfo(a).sortKey - applyInfo(b).sortKey || ageOf(b) - ageOf(a);
    if (dashSort === 'new')     return String(b.created_at||'').localeCompare(String(a.created_at||''));
    if (dashSort === 'company') return (a.company||'').localeCompare(b.company||'', 'ja') || ageOf(b) - ageOf(a);
    if (dashSort === 'proc')    return procOrder(a.proc) - procOrder(b.proc) || ageOf(b) - ageOf(a);
    return ageOf(b) - ageOf(a);   // days（既定）
  });
  _lastFiltered = filtered;

  if (!filtered.length) {
    document.getElementById('dash-content').innerHTML = `<div class="empty-state"><div class="empty-icon">📋</div><div class="empty-text">該当する案件がありません</div><div style="font-size:12px;">絞り込み条件を変えてみてください</div></div>`;
    return;
  }
  document.getElementById('dash-content').innerHTML = '<div class="dash-grid">' + filtered.map(c => {
    const p = gp(c), all = allTasks(c), dn = all.filter(t => c.checks[t.id]).length, pt = all.length ? Math.round(dn/all.length*100) : 0;
    const st = stInfo(c.status||'none');
    // 待ちチップは「書類・情報待ち」のときだけ。ほかのステータスに移ったら出さない
    // （waitFlags 自体は残すので、書類・情報待ちに戻せばチェックも戻る）
    const waitChips = (c.status||'none') === 'wait' && c.waitFlags && Object.keys(c.waitFlags).some(k=>c.waitFlags[k])
      ? `<div class="waiting-chips">${WAIT_ITEMS.filter(w=>c.waitFlags[w.key]).map(w=>`<span class="wchip">⏳ ${w.label}</span>`).join('')}</div>` : '';
    const tantoLast = c.tantoLog && c.tantoLog.length ? `<div style="font-size:10px;color:#64748B;margin-top:4px;">担当: ${esc(c.tantoLog[c.tantoLog.length-1].name)}</div>` : '';
    // 申請待ちのときは「登録からN日」を隠す（申請可能日バッジと数字が紛らわしいため）
    const ageDays = daysSince(c.created_at);
    const ageBadge = (ageDays === null || (c.status||'none') === 'shinsei')
      ? '' : `<span class="age-badge">登録から ${ageDays}日</span>`;
    const apBadge = applyBadge(c);
    const badgeRow = (ageBadge || apBadge) ? `<div class="badge-row">${ageBadge}${apBadge}</div>` : '';

    return `<div class="dc" onclick="openChecklist('${c.id}')">
      <div class="dc-head">
        ${dcDateCol(c)}
        <div class="dc-inf">
          <div class="dc-proc" style="color:${p.color}">${p.icon} ${c.freeName ? esc(c.freeName) : esc(c.proc)}${c.round?`<span style="background:#FEF9C3;color:#B45309;padding:1px 5px;border-radius:4px;font-size:9px;font-weight:700;">${esc(c.round)}</span>`:''}</div>
          <div class="dc-co">${esc(c.company)}</div>
          ${c.name ? `<div class="dc-sub">${esc(c.name)}</div>` : ''}
        </div>
      </div>
      ${badgeRow}
      ${waitChips}
      <div class="dc-bar"><div class="dc-bar-fill" style="width:${pt}%;background:${p.color}"></div></div>
      ${tantoLast}
      ${c.caseMemo ? '<div style="font-size:11px;color:#92400E;font-weight:700;margin-top:8px;padding:5px 8px;background:#FEF3C7;border-radius:4px;border-left:3px solid #F59E0B;line-height:1.5;">' + esc(c.caseMemo) + '</div>' : ''}
      <div class="dc-foot">
        <select class="st-sel" onchange="setStatusFromDash('${c.id}',this.value)" onclick="event.stopPropagation()"
          style="background-color:${st.bg};color:${st.color};border-color:${st.color};background-image:${caret(st.color)}">
          ${STATUSES.filter(s => s.key !== 'double' || c.proc === '月変・賃金入力').map(s=>`<option value="${s.key}"${(c.status||'none')===s.key?' selected':''}>${s.label}</option>`).join('')}
        </select>
        <div class="dc-acts">
          <button class="dc-btn dc-open" onclick="event.stopPropagation();openChecklist('${c.id}')" title="チェックリストを開く" aria-label="チェックリストを開く">☑</button>
          <button class="dc-btn dc-edit" onclick="event.stopPropagation();openEditCase('${c.id}')" title="修正" aria-label="修正">✏️</button>
          <button class="dc-btn dc-del" onclick="event.stopPropagation();deleteCase('${c.id}')" title="削除" aria-label="削除">🗑</button>
        </div>
      </div>
    </div>`;
  }).join('') + '</div>';
}

// ============================================================
// CSV出力（表示中の内容をそのまま出力）
// ============================================================
let _lastFiltered = [];

function csvCell(v) {
  const s = (v === null || v === undefined) ? '' : String(v);
  return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}

function exportCsv() {
  const rows = _lastFiltered || [];
  if (!rows.length) { toast('出力できる案件がありません'); return; }

  const header = ['会社名','氏名','手続き名','ステータス','経過日数','担当者','メモ','確認'];
  const body = rows.map(c => {
    const d = daysSince(c.created_at);
    const tanto = (c.tantoLog && c.tantoLog.length) ? c.tantoLog[c.tantoLog.length-1].name : '';
    return [
      c.company || '',
      c.name || '',
      c.freeName ? c.freeName : (c.proc || ''),
      stInfo(c.status || 'none').label,
      d === null ? '' : d,
      tanto,
      (c.caseMemo || '').replace(/\r?\n/g, ' '),
      ''   // 確認欄（印刷して手書きチェック用）
    ].map(csvCell).join(',');
  });

  const csv = '\uFEFF' + [header.map(csvCell).join(','), ...body].join('\r\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const now = new Date();
  const ymd = now.getFullYear() + String(now.getMonth()+1).padStart(2,'0') + String(now.getDate()).padStart(2,'0');

  // ファイル名に絞り込み条件を反映
  const parts = ['手続き一覧'];
  if (dashFilter !== 'all') parts.push(stInfo(dashFilter).label);
  const co = document.getElementById('company-filter');
  const pr = document.getElementById('proc-filter');
  if (co && co.value) parts.push(co.value);
  if (pr && pr.value) parts.push(pr.value);
  const fname = parts.join('_').replace(/[\\\/:*?"<>|]/g, '') + '_' + ymd + '.csv';

  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = fname;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast(`${rows.length}件をCSV出力しました`);
}

// ---- 手続き種別の並び順（新規案件ダイアログと同じ順） ----
// PROC_KEYS に無い種別は末尾に回す
function procOrder(pr) {
  const i = PROC_KEYS.indexOf(pr);
  return i === -1 ? 9999 : i;
}

// ---- 経過日数（案件登録日からの日数） ----
function daysSince(iso) {
  if (!iso) return null;
  const t = new Date(iso);
  if (isNaN(t)) return null;
  const a = new Date(t.getFullYear(), t.getMonth(), t.getDate());
  const now = new Date();
  const b = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  return Math.max(0, Math.round((b - a) / 86400000));
}

// ---- 申請可能日の判定 ----
function applyInfo(c) {
  const off = PROC_APPLY_OFFSET[c.proc];
  if (off === undefined) {
    return { kind:'na', days:null, label:'⚠️ 日付待ちの手続きではありません',
             color:'#B45309', bg:'#FEF3C7', applyYmd:'', sortKey:-100000 };
  }
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(c.procDate || '');
  if (!m) {
    return { kind:'nodate', days:null, label:'⚠️ 日付が入っていません',
             color:'#B91C1C', bg:'#FEF2F2', applyYmd:'', sortKey:-100000 };
  }
  const apply = new Date(+m[1], +m[2]-1, +m[3] + off);
  const n = new Date();
  const today = new Date(n.getFullYear(), n.getMonth(), n.getDate());
  const diff = Math.round((apply - today) / 86400000);
  const ymd = apply.getFullYear() + '/' + String(apply.getMonth()+1).padStart(2,'0') + '/' + String(apply.getDate()).padStart(2,'0');

  if (diff < 0)   return { kind:'over',   days:diff, label:`⚠️ 申請可能 ${-diff}日経過`, color:'#B91C1C', bg:'#FEF2F2', applyYmd:ymd, sortKey:diff };
  if (diff === 0) return { kind:'today',  days:0,    label:'📮 今日から申請できます',     color:'#C2410C', bg:'#FFF7ED', applyYmd:ymd, sortKey:0 };
  if (diff <= 3)  return { kind:'soon',   days:diff, label:`あと${diff}日`,              color:'#B45309', bg:'#FEF9C3', applyYmd:ymd, sortKey:diff };
  return            { kind:'future', days:diff, label:`あと${diff}日`,              color:'#64748B', bg:'#F1F5F9', applyYmd:ymd, sortKey:diff };
}

// 申請待ちの案件だけにバッジを出す
function applyBadge(c) {
  if ((c.status || 'none') !== 'shinsei') return '';
  const a = applyInfo(c);
  const ttl = a.applyYmd ? ` title="申請可能日 ${a.applyYmd}"` : '';
  return `<span class="apply-badge" style="background:${a.bg};color:${a.color}"${ttl}>${a.label}</span>`;
}

// ---- 日付欄（カード左端）----
function dcDateCol(c) {
  const cfg = PROC_DATE_CONFIG[c.proc], p = gp(c);
  // 日付を持たない手続き（労災・傷病手当など）は日付欄そのものを出さない
  if (!cfg) return '';
  // 日付を持つはずなのに空 → 入力漏れなので枠は残して知らせる
  if (!c.procDate) return `<div class="dc-date"><div class="dc-date-none">日付なし</div></div>`;

  const fmt = v => {
    const d = /^(\d{4})-(\d{2})-(\d{2})$/.exec(v || '');
    if (d) {
      const dt = new Date(+d[1], +d[2]-1, +d[3]);
      return { y:d[1], md:d[2]+'/'+d[3], w:'('+['日','月','火','水','木','金','土'][dt.getDay()]+')' };
    }
    const m = /^(\d{4})-(\d{2})$/.exec(v || '');
    if (m) return { y:m[1], md:m[2]+'月', w:'' };
    return { y:'', md:esc(v), w:'' };
  };

  const a = fmt(c.procDate);
  const lab = (cfg.label || '').replace('年月日', '日');
  const lab2 = cfg.label2 || '';
  const b = c.procDate2 ? fmt(c.procDate2) : null;

  return `<div class="dc-date">
    ${a.y ? `<div class="dc-date-y">${a.y}</div>` : ''}
    <div class="dc-date-md">${a.md}</div>
    ${a.w ? `<div class="dc-date-w">${a.w}</div>` : ''}
    <div class="dc-date-l" style="background:${p.color}14;color:${p.color}">${esc(lab)}</div>
    ${b ? `<div class="dc-date-2">${esc(lab2)} ${b.md}</div>` : ''}
  </div>`;
}

// ---- ステータスプルダウンの▼を文字色に合わせる ----
function caret(color) {
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 10 6"><path d="M1 1l4 4 4-4" stroke="${color}" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>`;
  return `url("data:image/svg+xml,${encodeURIComponent(svg)}")`;
}

function setDashFilter(f) {
  // 申請待ちを開いたら申請可能日順へ、離れたら元の既定へ自動で戻す
  if (f === 'shinsei' && dashSort === 'days') dashSort = 'apply';
  if (f !== 'shinsei' && dashSort === 'apply') dashSort = 'days';
  dashFilter = f;
  const el = document.getElementById('sort-select');
  if (el) el.value = dashSort;
  renderDash();
}
function setDashSort(v) { dashSort = v; renderDash(); }
function setProcFilter(pr) {
  const el = document.getElementById('proc-filter');
  if (el) el.value = el.value === pr ? '' : pr;
  renderDash();
}
function clearFilters() {
  dashFilter = 'all';
  const co = document.getElementById('company-filter');
  const pr = document.getElementById('proc-filter');
  const ta = document.getElementById('tanto-filter');
  if (co) co.value = '';
  if (pr) pr.value = '';
  if (ta) ta.value = '';
  dashSort = 'days';
  const so = document.getElementById('sort-select');
  if (so) so.value = 'days';
  renderDash();
}

async function setStatusFromDash(id, val) {
  const c = cases.find(x => x.id === id);
  if (!c) return;
  c.status = val;
  await saveCase(c);
  renderDash();
  renderSidebar();
}

      html += `<div class="task-card${ck?' done':''}">
        <div class="task-row">
          <div class="task-num" style="background:${ck?'#22C55E':p.color+'22'};color:${ck?'#fff':p.color}">${ck?'✓':sn}</div>
          <input type="checkbox" class="task-cb" ${ck?'checked':''} style="accent-color:${p.color}" onchange="toggleTask('${task.id}')">
          <div class="task-info">
            ${p.isFree
              ? '<input class="free-task-input" type="text" placeholder="タスクを入力..." value="' + esc(task.label) + '" onchange="saveFreeTaskLabel(\'' + task.id + '\',this.value)" onclick="event.stopPropagation()">'
              : '<div class="task-label' + (ck?' done':'') + '">' + esc(task.label) + '</div>'
            }
            ${task.warn ? `<div class="task-warn">${esc(task.warn)}</div>` : ''}
          </div>
          <button class="task-toggle" onclick="toggleNote('${task.id}')">${ex?'▲':'▼'}</button>
        </div>
        ${ex ? `<div class="task-note">💡 ${esc(task.note)}</div>` : ''}
        <div class="task-memo-wrap">
          <textarea class="task-memo-input" rows="1" placeholder="メモ..." id="tm-${task.id}" onchange="saveTaskMemo('${task.id}',this.value)" onfocus="this.rows=2" onblur="this.rows=1"></textarea>
        </div>
      </div>`;
    });
  });
  document.getElementById('cl-body').innerHTML = html;
  // タスクメモの値をセット（テンプレートリテラル汚染を避けるため）
  if (c.taskMemos) {
    Object.entries(c.taskMemos).forEach(([tid, val]) => {
      const el = document.getElementById('tm-' + tid);
      if (el && val) el.value = val;
    });
  }
}

async function toggleTask(taskId) {
  const c = cases.find(x => x.id === currentId);
  if (!c) return;
  c.checks[taskId] = !c.checks[taskId];
  renderChecklist();
  renderSidebar();
  await saveCase(c);
  // 月変・賃金入力：Wチェック前タスクが全部完了→「ダブルチェック」に自動変更
  const all = allTasks(c);
  if (c.proc === '月変・賃金入力' && (c.status||'none') === 'none') {
    const WCHECK_TASKS = ['mc20']; // WチェックセクションのタスクID
    const nonWcheckTasks = all.filter(t => !WCHECK_TASKS.includes(t.id));
    if (nonWcheckTasks.length > 0 && nonWcheckTasks.every(t => c.checks[t.id])) {
      c.status = 'double';
      await saveCase(c);
      renderChecklist();
      renderSidebar();
      toast('🔵 Wチェック前のタスクが完了しました。ステータスを「ダブルチェック」に変更しました');
      return;
    }
  }
  // 全タスク完了 → 自動で完了提案
  if (all.every(t => c.checks[t.id]) && (c.status||'none') !== 'done') {
    if (confirm('全タスクが完了しました。ステータスを「完了」に変更しますか？')) {
      c.status = 'done';
      await saveCase(c);
      renderChecklist();
      renderSidebar();
      toast('✅ 案件を完了にしました');
    }
  }
}

function selP(idx) {
  const btn = document.getElementById('pob'+idx);
  if (!btn) return;
  selProc = btn.getAttribute('data-key');
  PROC_KEYS.forEach((_,i) => {
    const b = document.getElementById('pob'+i);
    if (b) { b.style.borderColor='#E2E8F0'; b.style.color=''; b.style.background=''; }
  });
  const col = P[selProc].color;
  btn.style.borderColor = col;
  btn.style.color = col;
  btn.style.background = col+'18';
  // 労災の場合は様式選択エリアを表示
  const rArea = document.getElementById('rousai-shoshiki-area');
  if (selProc === '労災') {
    rArea.style.display = '';
    document.getElementById('rousai-shoshiki-grid').innerHTML = ROUSAI_SHOSHIKI.map(s =>
      `<label class="shoshiki-check" id="rsc-${s.key}" onclick="toggleShoshiki('${s.key}',this)">

      </label>`
    ).join('');
  } else {
    rArea.style.display = 'none';
  }
  // 申請日付エリア
  const dateArea = document.getElementById('proc-date-area');
  const dateConfig = PROC_DATE_CONFIG[selProc];
  if (dateArea) {
    if (dateConfig) {
      dateArea.style.display = '';
      document.getElementById('proc-date-label').textContent = dateConfig.label;
      document.getElementById('n-proc-date').type = dateConfig.type;
      document.getElementById('n-proc-date').value = '';
      // 2つ目の日付欄（月変月）
      const date2Area = document.getElementById('proc-date2-area');
      if (date2Area) {
        if (dateConfig.label2) {
          date2Area.style.display = '';
          document.getElementById('proc-date2-label').textContent = dateConfig.label2;
          document.getElementById('n-proc-date2').type = dateConfig.type2 || 'month';
          document.getElementById('n-proc-date2').value = '';
        } else {
          date2Area.style.display = 'none';
        }
      }
    } else {
      dateArea.style.display = 'none';
      const date2Area = document.getElementById('proc-date2-area');
      if (date2Area) date2Area.style.display = 'none';
    }
  }

  // フリー手続き名エリア
  const fnArea = document.getElementById('free-name-area');
  if (fnArea) fnArea.style.display = selProc === 'フリー' ? '' : 'none';
  if (selProc === 'フリー') document.getElementById('n-free-name').value = '';

  // 賞与計算あり/なし選択エリア
  const calcArea = document.getElementById('calc-select-area');
  if (calcArea) {
    if (P[selProc] && P[selProc].hasCalc) {
      calcArea.style.display = '';
      document.getElementById('calc-yes').checked = true;
      updateCalcSelect();
    } else {
      calcArea.style.display = 'none';
    }
  }

  // 保険加入（社保あり/雇用保険のみ）選択エリア
  const sArea = document.getElementById('shaho-select-area');
  if (sArea) {
    if (P[selProc] && P[selProc].hasShaho) {
      sArea.style.display = '';
      document.getElementById('shaho-yes').checked = true;
    } else {
      sArea.style.display = 'none';
    }
  }

  // 扶養あり/なし選択エリア
  const fArea = document.getElementById('fuyo-select-area');
  if (P[selProc] && P[selProc].hasFuyo) {
    fArea.style.display = '';
    // ラジオをリセット
    document.getElementById('fuyo-yes').checked = true;
    updateFuyoSelect();
  } else {
    fArea.style.display = 'none';
  }
  updateShahoSelect();
  uNewBtn();
}

async function createCase() {
  const co = document.getElementById('n-co').value.trim();
  const na = document.getElementById('n-na').value.trim();
  const round = document.getElementById('n-round') ? document.getElementById('n-round').value.trim() : '';
  const freeName = (selProc === 'フリー' && document.getElementById('n-free-name')) ? document.getElementById('n-free-name').value.trim() : '';
  const fuyoYes = document.getElementById('fuyo-yes');
  const hasFuyo = (!fuyoYes || !document.getElementById('fuyo-select-area') || document.getElementById('fuyo-select-area').style.display === 'none') ? true : fuyoYes.checked;
  const shahoYes = document.getElementById('shaho-yes');
  const hasShaho = (!shahoYes || !document.getElementById('shaho-select-area') || document.getElementById('shaho-select-area').style.display === 'none') ? true : shahoYes.checked;
  const calcYes = document.getElementById('calc-yes');
  const hasCalc = (!calcYes || !document.getElementById('calc-select-area') || document.getElementById('calc-select-area').style.display === 'none') ? null : calcYes.checked;
  if (!co || !selProc) return;
  const procKey = selProc;
  const procDate = (document.getElementById('n-proc-date') && PROC_DATE_CONFIG[procKey]) ? document.getElementById('n-proc-date').value : '';
  const procDate2 = (document.getElementById('n-proc-date2') && PROC_DATE_CONFIG[procKey] && PROC_DATE_CONFIG[procKey].label2) ? document.getElementById('n-proc-date2').value : '';
  // 労災の場合、選択した様式を収集
  const rousaiShoshiki = procKey === '労災'
    ? ROUSAI_SHOSHIKI.filter(s => {
        const cb = document.getElementById('rscb-'+s.key);
        return cb && cb.checked;
      }).map(s => s.key)
    : [];
  closeModal('ov-new');
  document.getElementById('n-co').value = '';
  document.getElementById('n-na').value = '';
  if (document.getElementById('n-round')) document.getElementById('n-round').value = '';
  if (document.getElementById('n-free-name')) document.getElementById('n-free-name').value = '';
  if (document.getElementById('free-name-area')) document.getElementById('free-name-area').style.display = 'none';
  if (document.getElementById('n-proc-date')) document.getElementById('n-proc-date').value = '';
  if (document.getElementById('calc-yes')) document.getElementById('calc-yes').checked = true;
  if (document.getElementById('calc-select-area')) document.getElementById('calc-select-area').style.display = 'none';
  if (document.getElementById('n-proc-date2')) document.getElementById('n-proc-date2').value = '';
  if (document.getElementById('proc-date-area')) document.getElementById('proc-date-area').style.display = 'none';
  if (document.getElementById('proc-date2-area')) document.getElementById('proc-date2-area').style.display = 'none';
  if (document.getElementById('fuyo-yes')) document.getElementById('fuyo-yes').checked = true;
  if (document.getElementById('fuyo-select-area')) document.getElementById('fuyo-select-area').style.display = 'none';
  if (document.getElementById('shaho-yes')) document.getElementById('shaho-yes').checked = true;
  if (document.getElementById('shaho-select-area')) document.getElementById('shaho-select-area').style.display = 'none';
  selProc = null;
  document.getElementById('n-submit').disabled = true;
  setSyncStatus('🔄 保存中...');
  // まずSupabaseに保存してIDを確定させる
  const payload = {
    company: co, name: na, proc: procKey, free_name: freeName,
    proc_date: procDate,
    proc_date2: procDate2,
    status: 'none', checks: {}, wait_flags: {}, wait_memo: '', tanto_log: [],
    rousai_shoshiki: rousaiShoshiki,
    case_memo: '', task_memos: {}, round: round, ha_fuyo: hasFuyo,
    has_calc: hasCalc, has_tsukihen: null, has_shaho: hasShaho,
    free_labels: {},
    created_at: new Date().toISOString(), updated_at: new Date().toISOString(),
  };
  const row = await sbInsert(payload);
  if (row) {
    const c = {
      ...row,
      id: String(row.id),
      checks: row.checks || {},
      waitFlags: row.wait_flags || {},
      waitMemo: row.wait_memo || '',
      tantoLog: row.tanto_log || [],
      rousaiShoshiki: row.rousai_shoshiki || [],
      caseMemo: row.case_memo || '',
      taskMemos: row.task_memos || {},
      round: row.round || '',
      freeName: row.free_name || '',
      procDate: row.proc_date || '',
      procDate2: row.proc_date2 || '',
      hasFuyo: row.ha_fuyo !== false,
      hasCalc: row.has_calc !== null ? row.has_calc : null,
      hasTsukihen: row.has_tsukihen !== null ? row.has_tsukihen : null,
      hasShaho: row.has_shaho !== false,
      freeLabels: row.free_labels || {},
    };
    cases.push(c);
    localStorage.setItem('cl-cases', JSON.stringify(cases));
    _lastSync = Date.now();
    setSyncStatus('☁️ 保存済');
    toast('✅ 案件を作成しました');
    renderAll();
    openChecklist(c.id);
  } else {
    toast('⚠️ DB保存に失敗しました。テーブルの設定を確認してください。');
    setSyncStatus('⚠️ 保存失敗');
  }
}

function backupData() {
  const data = {
    version: 1,
    exportedAt: new Date().toISOString(),
    cases: cases,
  };
  const json = JSON.stringify(data, null, 2);
  const blob = new Blob([json], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const date = new Date().toISOString().split('T')[0].replace(/-/g, '');
  a.href = url;
  a.download = `チェックリストバックアップ_${date}.json`;
  a.click();
  URL.revokeObjectURL(url);
  toast('💾 データを保存しました');
}

async function restoreData(event) {
  const file = event.target.files[0];
  if (!file) return;
  if (!confirm('現在のデータをバックアップデータで上書きします。よろしいですか？\n※この操作は元に戻せません。')) {
    event.target.value = '';
    return;
  }
  try {
    const text = await file.text();
    const data = JSON.parse(text);
    const importCases = data.cases || data;
    if (!Array.isArray(importCases)) throw new Error('データ形式が正しくありません');

    setSyncStatus('🔄 復元中...');
    let successCount = 0;
    let failCount = 0;
    for (const c of importCases) {
      const payload = {
        company: c.company || '',
        name: c.name || '',
        proc: c.proc || '',
        free_name: c.freeName || c.free_name || '',
        proc_date: c.procDate || c.proc_date || '',
        proc_date2: c.procDate2 || c.proc_date2 || '',
        status: c.status || 'none',
        checks: c.checks || {},
        wait_flags: c.waitFlags || c.wait_flags || {},
        wait_memo: c.waitMemo || c.wait_memo || '',
        tanto_log: c.tantoLog || c.tanto_log || [],
        rousai_shoshiki: c.rousaiShoshiki || c.rousai_shoshiki || [],
        case_memo: c.caseMemo || c.case_memo || '',
        task_memos: c.taskMemos || c.task_memos || {},
        round: c.round || '',
        ha_fuyo: c.hasFuyo !== false,
    has_calc: c.hasCalc !== null ? c.hasCalc : null,
        has_shaho: c.hasShaho !== false,
        has_tsukihen: (c.hasTsukihen !== undefined ? c.hasTsukihen
                     : (c.has_tsukihen !== undefined ? c.has_tsukihen : null)),
        free_labels: c.freeLabels || c.free_labels || {},
        updated_at: new Date().toISOString(),
      };
      /* 案件がDBに残っていれば上書き、消えていれば同じidで作り直します。
         以前は sbUpdate だけを呼んでいたため、削除済みの案件は
         0件更新のまま「復元しました」と表示されていました。 */
      let ok;
      if (c.id) {
        payload.id = Number(c.id);
        payload.created_at = c.created_at || new Date().toISOString();
        ok = await sbRestoreOne(payload);
      } else {
        payload.created_at = new Date().toISOString();
        ok = !!(await sbInsert(payload));
      }
      if (ok) successCount++; else failCount++;
    }
    await loadData();
    if (failCount > 0) {
      toast(`⚠️ ${successCount}件を復元しましたが、${failCount}件は失敗しました`);
      setSyncStatus('⚠️ 一部復元できませんでした');
    } else {
      toast(`✅ ${successCount}件のデータを復元しました`);
    }
  } catch(e) {
    toast('❌ 復元に失敗しました: ' + e.message);
    setSyncStatus('⚠️ 復元失敗');
  }
  event.target.value = '';
}

// ============================================================
// 印刷用ウィンドウ
// ============================================================
function openPrintWindow() {
  const c = cases.find(x => x.id === currentId);
  if (!c) return;
  const p = gp(c);
  const hasFuyo = c.hasFuyo !== false;

  // 表示するセクションを決定
  let visibleSections = p.isRousai && c.rousaiShoshiki && c.rousaiShoshiki.length > 0
    ? p.sections.filter(s => !s.rousaiKey || c.rousaiShoshiki.includes(s.rousaiKey))
    : p.sections;
  if (p.hasCalc && c.hasCalc === false) visibleSections = visibleSections.filter(s => !s.calcOnly);
  if (c.hasTsukihen === false) visibleSections = visibleSections.filter(s => !s.tsukihenOnly);

  const all = visibleSections.flatMap(s => s.tasks).filter(t => taskVisible(t, c));
  const dn = all.filter(t => c.checks[t.id]).length;
  const pt = all.length ? Math.round(dn / all.length * 100) : 0;

  // 担当者ログ
  const tantoLog = (c.tantoLog || []).map(t => `${t.date} ${t.name}`).join('　/　');

  // タスク一覧HTML生成
  let taskRows = '';
  let sn = 0;
  visibleSections.forEach(sec => {
    const filteredTasks = sec.tasks.filter(t => taskVisible(t, c));
    if (filteredTasks.length === 0) return;
    const sd = filteredTasks.filter(t => c.checks[t.id]).length;
    taskRows += `<tr class="sec-row"><td colspan="3">${sec.title}　${sd}/${filteredTasks.length}</td></tr>`;
    filteredTasks.forEach(task => {
      sn++;
      const ck = !!c.checks[task.id];
      const memo = (c.taskMemos && c.taskMemos[task.id]) || '';
      taskRows += `<tr class="${ck ? 'done-row' : ''}">
        <td class="num-cell">${sn}</td>
        <td class="check-cell">${ck ? '✓' : '□'}</td>
        <td class="label-cell">
          <div class="task-label">${task.label}</div>
          ${task.warn ? `<div class="task-warn">${task.warn}</div>` : ''}
          ${memo ? `<div class="task-memo">${memo}</div>` : ''}
        </td>
      </tr>`;
    });
  });

  const html = `<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>${c.company}　${c.proc}　チェックリスト</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Noto Sans JP', 'Meiryo', sans-serif; font-size: 11px; color: #1E293B; padding: 16px; }
  h1 { font-size: 15px; font-weight: 700; margin-bottom: 4px; }
  .meta { font-size: 10px; color: #64748B; margin-bottom: 12px; display: flex; gap: 16px; flex-wrap: wrap; }
  .meta span { display: flex; align-items: center; gap: 4px; }
  .progress { background: #E2E8F0; border-radius: 3px; height: 8px; margin-bottom: 12px; }
  .progress-fill { height: 100%; border-radius: 3px; background: ${p.color}; width: ${pt}%; }
  table { width: 100%; border-collapse: collapse; }
  .sec-row td { background: ${p.color}18; color: ${p.color}; font-weight: 700; padding: 5px 8px; border: 1px solid #E2E8F0; font-size: 11px; }
  tr td { border: 1px solid #E2E8F0; padding: 4px 6px; vertical-align: top; }
  .num-cell { width: 28px; text-align: center; color: #94A3B8; font-size: 10px; }
  .check-cell { width: 22px; text-align: center; font-size: 13px; }
  .label-cell { }
  .task-label { font-size: 11px; line-height: 1.4; }
  .task-warn { font-size: 10px; color: #C2410C; background: #FFF7ED; padding: 2px 5px; border-radius: 2px; margin-top: 2px; }
  .task-memo { font-size: 10px; color: #475569; background: #F8FAFC; padding: 2px 5px; border-radius: 2px; margin-top: 2px; }
  .done-row td { background: #F0FDF4; }
  .done-row .task-label { text-decoration: line-through; color: #166534; }
  .footer { margin-top: 12px; font-size: 10px; color: #94A3B8; text-align: right; }
  @media print {
    body { padding: 8px; }
    @page { margin: 10mm; }
  }
</style>
</head>
<body>
  <h1>${p.icon} ${c.company}　<span style="color:${p.color}">${c.proc}</span>${c.freeName ? '　' + c.freeName : ''}${c.round ? '　' + c.round : ''}</h1>
  <div class="meta">
    ${c.name ? `<span>👤 ${c.name}</span>` : ''}
    ${c.procDate ? `<span>📅 ${c.procDate}</span>` : ''}
    ${c.procDate2 ? `<span>📅 ${c.procDate2}</span>` : ''}
    <span>進捗 ${pt}%（${dn}/${all.length} タスク完了）</span>
    ${tantoLog ? `<span>担当：${tantoLog}</span>` : ''}
  </div>
  <div class="progress"><div class="progress-fill"></div></div>
  ${c.caseMemo ? `<div style="margin-bottom:10px;padding:6px 8px;background:#FEF3C7;border-left:3px solid #F59E0B;font-size:11px;font-weight:700;color:#92400E;">${c.caseMemo}</div>` : ''}
  <table>
    ${taskRows}
  </table>
  <div class="footer">SR Office 手続きチェックリスト　出力日：${new Date().toLocaleDateString('ja-JP')}</div>
</body>
</html>`;

  const w = window.open('', '_blank', 'width=800,height=900');
  w.document.write(html);
  w.document.close();
  setTimeout(() => w.print(), 500);
}
